<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<title>لوحة تحكم Flame Boutique34</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&family=Noto+Naskh+Arabic:wght@400;600&family=Reem+Kufi:wght@500;600&display=swap">
<style>
/* Same palette as the store; the dashboard is a working tool, so it stays quiet and dense. */
:root{
  --linen:#FBF6F0; --surface:#FFFDF9; --ink:#3B2A26; --muted:#7A635D; --mulberry:#A3576A; --on-mulberry:#FFF8F5;
  --ember:#B08A4A; --rose:#F4E3DE; --line:#E8D8CC; --danger:#B3343F; --frame:#FFFDF9;
  --st-received:#9A7432; --st-contacting:#B0602C; --st-confirmed:#2F5D8A; --st-preparing:#4E5FA0; --st-handed_to_carrier:#6A4C93;
  --st-out_for_delivery:#8A3F86; --st-delivered:#2E7D4F; --st-cancelled:#7F7479; --st-failed:#B3343F;
  --display:"Marcellus","Reem Kufi",Georgia,serif;
  --body:"Jost","Noto Naskh Arabic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --linen:#1D1716; --surface:#28201E; --ink:#F4ECE6; --muted:#BFAEA6; --mulberry:#E7A9B6; --on-mulberry:#2A1A1E;
  --ember:#D8B271; --rose:#3A2D2B; --line:#4A3B37; --danger:#F08A8F; --frame:#EFE4DE;
  --st-received:#D8B271; --st-contacting:#E8A06A; --st-confirmed:#7FB0E0; --st-preparing:#9AA8E8; --st-handed_to_carrier:#B79BE0;
  --st-out_for_delivery:#D79BD3; --st-delivered:#7CC79A; --st-cancelled:#A99DA5; --st-failed:#F08A8F; color-scheme:dark}}
:root[data-theme="dark"]{
  --linen:#1D1716; --surface:#28201E; --ink:#F4ECE6; --muted:#BFAEA6; --mulberry:#E7A9B6; --on-mulberry:#2A1A1E;
  --ember:#D8B271; --rose:#3A2D2B; --line:#4A3B37; --danger:#F08A8F; --frame:#EFE4DE;
  --st-received:#D8B271; --st-contacting:#E8A06A; --st-confirmed:#7FB0E0; --st-preparing:#9AA8E8; --st-handed_to_carrier:#B79BE0;
  --st-out_for_delivery:#D79BD3; --st-delivered:#7CC79A; --st-cancelled:#A99DA5; --st-failed:#F08A8F; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:500;margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:42px;padding:0 1.1rem;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;font-weight:500;white-space:nowrap}
.btn-primary{background:var(--mulberry);color:var(--on-mulberry)}
.btn-ghost{border-color:var(--line);background:var(--surface)}
.btn-danger{border-color:var(--danger);color:var(--danger);background:transparent}
.btn-danger.armed{background:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-sm{min-height:34px;padding:0 .8rem;font-size:.88rem}
.link{background:none;border:0;padding:.2rem;color:var(--mulberry);cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.login form{width:min(380px,100%);display:grid;gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2rem 1.5rem;text-align:center}
.login svg{width:44px;height:52px;margin-inline:auto}
.login h1{font-size:1.5rem}

/* ---------- shell ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-bar{display:flex;align-items:center;gap:.8rem;min-height:60px}
.brand{display:flex;align-items:center;gap:.5rem;margin-inline-end:auto;min-width:0}
.brand svg{width:24px;height:30px;flex:none}
.brand b{font-family:var(--display);font-weight:500;font-size:1.15rem;white-space:nowrap}
@media (max-width:520px){.brand b{display:none}}
.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.1rem .65rem;border-radius:999px;font-size:.8rem;border:1px solid var(--line);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tabs{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:none;border:0;border-bottom:2px solid transparent;padding:.7rem .9rem;cursor:pointer;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--mulberry)}
.tab .count{background:var(--mulberry);color:var(--on-mulberry);border-radius:999px;font-size:.72rem;padding:0 .45rem;margin-inline-start:.3rem}
main{padding-block:1.5rem 4rem}
.panel{display:grid;gap:1.5rem}
.panel>*{min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem}
.panel-head h2{font-size:1.5rem}
.toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.banner{padding:.8rem 1rem;border-radius:12px;background:var(--rose);display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:center;justify-content:space-between}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.2rem}
.box h3{font-size:1.1rem;margin-bottom:.8rem}

/* ---------- overview ---------- */
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{min-height:36px;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;white-space:nowrap;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--linen);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:1rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1rem 1.1rem;display:grid;gap:.2rem}
.kpi .label{color:var(--muted);font-size:.9rem}
.kpi .value{font-family:var(--display);font-size:1.75rem;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .sub{color:var(--muted);font-size:.82rem}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:1rem}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--linen);padding:.35rem .6rem;border-radius:8px;font-size:.82rem;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
.rank li{display:grid;grid-template-columns:1fr auto;gap:.2rem .8rem;align-items:center}
.rank .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--rose);overflow:hidden}
.rank .bar i{display:block;height:100%;background:var(--mulberry);border-radius:4px}
.empty{color:var(--muted);padding-block:.5rem}

/* ---------- orders ---------- */
.search{min-height:40px;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);min-width:0;width:280px;max-width:100%}
.toolbar .field{flex:1 1 150px}
.orders{display:grid;gap:.6rem}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.order summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) auto auto;gap:.4rem 1rem;align-items:center;padding:.8rem 1rem}
.order summary::-webkit-details-marker{display:none}
.o-tags{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.3rem}.o-tags:empty{display:none}
.order summary small{display:block;color:var(--muted);font-size:.8rem}
.order[open] summary{border-bottom:1px solid var(--line)}
.order-body{padding:1rem;display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.order-body dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3rem .8rem}
.order-body dt{color:var(--muted)}
.order-body dd{margin:0;min-width:0;overflow-wrap:anywhere}
.items{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.items li{display:flex;justify-content:space-between;gap:.6rem}
.st{color:var(--st-received)}
.st-received{color:var(--st-received)}.st-contacting{color:var(--st-contacting)}.st-confirmed{color:var(--st-confirmed)}.st-preparing{color:var(--st-preparing)}.st-handed_to_carrier{color:var(--st-handed_to_carrier)}.st-out_for_delivery{color:var(--st-out_for_delivery)}.st-delivered{color:var(--st-delivered)}.st-cancelled{color:var(--st-cancelled)}.st-failed{color:var(--st-failed)}
.status-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:.5rem}
.status-cell{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.55rem .8rem;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:start}
.status-cell:hover{border-color:var(--mulberry)}
.status-cell b{font-size:1.1rem}
.history{list-style:none;margin:0;padding:0;display:grid;gap:.35rem}
.history li{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.commune-picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:.3rem .8rem;max-height:360px;overflow-y:auto;padding:.6rem;border:1px solid var(--line);border-radius:12px}
td input[type=number]::placeholder{color:var(--muted)}
.o-code small{display:block}
@media (max-width:640px){.order summary{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"code st" "who total"}.o-code{grid-area:code}.o-st{grid-area:st;justify-self:end}.o-who{grid-area:who;min-width:0}.o-total{grid-area:total;justify-self:end;align-self:start}}

/* ---------- forms ---------- */
.field{display:grid;gap:.3rem;min-width:0}
.field label,.field .lbl{font-size:.88rem;color:var(--muted)}
.field input:not([type=checkbox]):not([type=color]):not([type=file]),.field select,.field textarea{min-height:42px;padding:.5rem .8rem;border-radius:10px;border:1px solid var(--line);background:var(--linen);width:100%}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:.8rem}
.check{display:flex;align-items:center;gap:.5rem;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--mulberry)}
.err{color:var(--danger);font-size:.88rem}
.savebar{position:sticky;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-block:.8rem calc(.8rem + env(safe-area-inset-bottom,0px));display:flex;gap:.8rem;align-items:center;justify-content:flex-end;border-radius:12px 12px 0 0;padding-inline:1rem}

/* ---------- products ---------- */
.plist{display:grid;gap:.6rem}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.6rem .9rem}
.thumb{width:56px;aspect-ratio:3/4;border-radius:999px 999px 4px 4px;overflow:hidden;display:grid;place-items:center}
.thumb svg{width:80%}
.thumb img{width:100%;height:100%;object-fit:cover}
.prow .name{font-family:var(--display);font-size:1.02rem}
.prow .meta{color:var(--muted);font-size:.85rem;display:flex;flex-wrap:wrap;gap:.2rem .9rem}
.prow .acts{display:flex;gap:.3rem;align-items:center}
.icon{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-grid;place-items:center}
.icon[disabled]{opacity:.35;cursor:not-allowed}
.off{opacity:.55}
@media (max-width:640px){.prow{grid-template-columns:48px minmax(0,1fr) auto}.prow .acts.move{display:none}.thumb{width:48px}}

dialog{border:0;padding:0;color:var(--ink);background:var(--surface);max-width:100%;max-height:100%}
dialog::backdrop{background:rgba(20,10,18,.55)}
.editor{width:min(760px,calc(100% - 24px));max-height:calc(100% - 24px);border-radius:18px;display:flex;flex-direction:column}
.editor:not([open]){display:none}
.editor-head{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.editor-body{overflow-y:auto;padding:1.2rem;display:grid;gap:1.1rem}
.editor-foot{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;padding:1rem 1.2rem;border-top:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0;padding:.9rem;display:grid;gap:.8rem;min-width:0}
legend{padding:0 .4rem;font-weight:500}
.color-row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) auto auto;gap:.5rem;align-items:center}
.color-row input[type=color]{width:44px;height:42px;border:1px solid var(--line);border-radius:10px;background:none;padding:2px;cursor:pointer}
.mini{width:42px;height:42px;border-radius:8px;overflow:hidden;border:1px solid var(--line);display:grid;place-items:center;font-size:.7rem;color:var(--muted);background:var(--linen)}
.mini img{width:100%;height:100%;object-fit:cover}
@media (max-width:560px){.color-row{grid-template-columns:44px minmax(0,1fr) auto;}.color-row .fr{grid-column:2}}
.upload{display:inline-flex;align-items:center;gap:.4rem;cursor:pointer}
.upload input{position:absolute;opacity:0;width:1px;height:1px}
.stock-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:.5rem}
.main-img{display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.main-img .thumb{width:72px}
.extra-imgs{display:flex;flex-wrap:wrap;gap:.8rem}
.extra{display:grid;gap:.3rem;justify-items:center}
.extra .mini{width:72px;height:90px}
.extra .icon{width:28px;height:28px;font-size:.8rem}

/* ---------- shipping ---------- */
.table-scroll{position:relative;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:.45rem .7rem;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:.88rem;background:var(--surface);position:sticky;top:0}
td input[type=number]{width:96px;min-height:36px;padding:.3rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--linen)}
tr.disabled td{opacity:.5}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:.5rem;align-items:end}

.toast{position:fixed;inset-block-end:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--ink);color:var(--linen);padding:.7rem 1.1rem;border-radius:999px;transition:opacity .2s,transform .3s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger)}
/* connection check on the login page */
.diag{list-style:none;margin:0;padding:.8rem 1rem;display:grid;gap:.55rem;text-align:start;font-size:.86rem;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.diag li{display:grid;grid-template-columns:1.3rem 1fr;gap:.1rem .4rem}
.diag li::before{content:"✓";color:var(--st-delivered,#2E8B57);font-weight:700}
.diag li.bad::before{content:"✕";color:var(--danger,#B3343F)}
.diag li.wait::before{content:"…";color:var(--muted)}
.diag small{grid-column:2;color:var(--muted)}
.diag li.bad small{color:inherit}
.diag code{display:block;margin-top:.25rem;direction:ltr;text-align:left;unicode-bidi:isolate;font-size:.76rem;overflow-wrap:anywhere;opacity:.85}
tr.from-zr td{background:color-mix(in oklab,#2f6b3a 10%,transparent)}
/* ZR Express in an order */
.zr-box{display:grid;gap:.35rem;padding:.6rem .7rem;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.zr-box .link{justify-self:start}
.zr-pill{background:var(--surface)}
.zr-delivered{color:#2f6b3a}.zr-returned,.zr-attempt,.zr-cancelled{color:#9a3b2f}
/* customer history and WhatsApp messages in an order */
.hist{font-size:.74rem}
.wa-msgs{display:flex;flex-wrap:wrap;gap:.35rem}
.wa-msgs .btn{min-height:32px;padding:0 .7rem;font-size:.8rem}
.hist-list{list-style:none;margin:0;padding:0;display:grid;gap:.3rem}
.hist-list li{display:flex;flex-wrap:wrap;gap:.2rem .5rem;align-items:center}
/* racks tab */
.rk-list{display:grid;gap:1rem}
.rk{display:grid;gap:.8rem}
.rk-head{display:grid;grid-template-columns:1fr 1fr auto;gap:.6rem 1rem;align-items:end}
@media (max-width:760px){.rk-head{grid-template-columns:1fr}}
.rk-items{display:flex;flex-wrap:wrap;gap:.7rem;padding:.8rem;border-radius:12px;border-top:5px solid #A27A48;background:var(--linen)}
.rk-item{display:grid;gap:.25rem;justify-items:center;width:104px;text-align:center}
.rk-item.off{opacity:.45}
.rk-item .icon{width:26px;height:26px;font-size:.75rem}
.rk-pic{width:72px;height:96px;display:grid;place-items:center;border-radius:6px;background:repeating-conic-gradient(#e6e0d8 0 25%,#fff 0 50%) 0 0/10px 10px}
.rk-pic img{max-width:100%;max-height:100%;object-fit:contain}
/* rack photos in the product editor: shown on a checkerboard, so a missing background is obvious */
.cut-row{display:flex;flex-wrap:wrap;gap:1rem}
.cut{display:grid;gap:.35rem;justify-items:start;max-width:220px}
.cut-pic{width:120px;height:150px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;
  background:repeating-conic-gradient(#e6e0d8 0 25%,#fff 0 50%) 0 0/16px 16px}
.cut-pic img{max-width:100%;max-height:100%;object-fit:contain}
.cut-mini{background:repeating-conic-gradient(#e6e0d8 0 25%,#fff 0 50%) 0 0/10px 10px}
.cut-mini img{object-fit:contain}
/* reviews */
.stars{position:relative;display:inline-block;line-height:1;letter-spacing:.08em;white-space:nowrap}
.stars::before{content:"★★★★★";color:var(--line)}
.stars>span{position:absolute;inset-block:0;inset-inline-start:0;overflow:hidden}
.stars>span::before{content:"★★★★★";color:#C99A4E}
.rlist{display:grid;gap:.7rem}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem 1rem;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem}
.rrow.pending{border-color:var(--mulberry)}
.rrow p{overflow-wrap:anywhere}
.rrow .meta{display:flex;flex-wrap:wrap;gap:.2rem .8rem;font-size:.85rem;color:var(--muted)}
.rrow .acts{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:flex-end}
.rrow img{width:72px;height:72px;object-fit:cover;border-radius:8px;display:block}
@media (max-width:640px){.rrow{grid-template-columns:1fr}.rrow .acts{justify-content:flex-start}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>

  <symbol id="i-flame" viewBox="0 0 30 36"><path fill="none" stroke="currentColor" stroke-width="1.3" d="M2 35V14a13 13 0 0 1 26 0v21"/><path style="fill:var(--ember)" d="M15 12c2 3.5 5.5 5.5 5 10a5 5 0 0 1-10 0c-.3-3.3 2.6-4.6 3.2-7 .6 1.5 1.2 2 1.8 2.4.4-1.6.3-3.3 0-5.4Z"/></symbol>

<script>
const $ = s=>document.querySelector(s), $$ = s=>[...document.querySelectorAll(s)];
const esc = FB.esc, money = n=>FB.money(n);
const clone = o=>JSON.parse(JSON.stringify(o));
const sum = (a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
let D = null;                 // {settings, products, orders}
let tab = "overview";
const ui = {period:"30", ordStatus:"all", ordQuery:"", ordLimit:60, open:new Set(), prodQuery:"", revStatus:"pending", revForm:null};

const TABS = [["overview","نظرة عامة"],["orders","الطلبات"],["products","المنتجات"],["racks","الرفوف"],["reviews","الآراء"],["shipping","التوصيل"],["site","إعدادات الموقع"],["account","الحساب"]];

/* ---------- feedback ---------- */
let toastTimer;
function toast(msg, bad){ const el=$("#toast"); el.textContent=msg; el.classList.toggle("bad",!!bad); el.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),2600); }
function errText(e){
  const m = String(e?.message||e);
  if (m.includes("schema:cutout")) return "قاعدة البيانات لا تعرف صور الرف بعد: شغّل supabase/setup.sql مرة أخرى في Supabase (آمن)، ثم أعد الحفظ.";
  if (m.includes("storage_full")) return "امتلأت ذاكرة المتصفح في وضع التجربة. استعمل صوراً أقل أو أصغر.";
  if (m.startsWith("courier:")){
    const zr = {
      "courier:keys": "أدخل مفاتيح ZR Express أولاً: إعدادات الموقع ← شركة التوصيل ZR Express.",
      "courier:off": "الربط مع ZR Express غير مفعّل: إعدادات الموقع ← شركة التوصيل ZR Express.",
      "courier:shipping": "حدّد سعر التوصيل أولاً: ZR تحتاج المبلغ الكامل الذي ستدفعه الزبونة عند الاستلام.",
      "courier:status": "هذا الطلب ملغى أو مُسلَّم أو تعذّر تسليمه: لا يُرسل إلى ZR.",
      "courier:auth": "ZR رفضت المفتاح (401): تحقّق من مفتاح API، ومن أن صلاحيته لم تنتهِ.",
      "courier:tenant": "ZR رفضت الطلب (403): تحقّق من رقم الحساب (Tenant ID) ومن صلاحيات المفتاح.",
      "courier:net": "تعذّر الوصول إلى ZR Express. أعد المحاولة بعد قليل.",
      "courier:slow": "ZR لم تردّ في الوقت. أعد المحاولة: الموقع يتحقق أولاً من أن الطرد لم يُسجَّل من قبل، فلا يتكرر.",
      "courier:nodesk": "لم تُرجع ZR أي مكتب في ولاية الزبونة. اتصل بها لتغيير التوصيل إلى المنزل.",
      "courier:noid": "ZR لم تُرجع رقم الطرد. افتح حسابك في ZR وتحقق قبل إعادة الإرسال.",
      "courier:path": "طلب غير مسموح به إلى ZR."}[m];
    if (zr) return zr;
    if (m === "courier:http" || m === "courier:refused") return "ZR Express رفضت الطلب" + (e.detail ? `: ${e.detail}` : ".");
  }
  if (m.includes("pg_net_missing")) return "فعّل الإضافة pg_net في Supabase أولاً (Database ← Extensions ← pg_net).";
  if (m === "demo") return "في وضع التجربة لا يتصل الموقع بأي خدمة خارجية.";
  if (m.includes("network")||m.includes("Failed to fetch")) return "تعذّر الاتصال. تحقّق من الإنترنت ثم أعد المحاولة.";
  return "لم يتم الحفظ: " + m;
}
async function act(btn, fn, okMsg){
  const label = btn?.textContent; if (btn){ btn.disabled = true; btn.textContent = "جارٍ الحفظ…"; }
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch(e){ toast(errText(e), true); return false; }
  finally { if (btn){ btn.disabled = false; btn.textContent = label; } }
}

/* ---------- login ---------- */
const cfg = window.FB_CONFIG || {};
// live mode without ADMIN_EMAIL in config.js: the owner types the email too
const askEmail = FB_API.mode==="live" && !cfg.ADMIN_EMAIL;
$("#emailBox").hidden = !askEmail;
$("#loginHint").textContent = FB_API.mode==="demo"
  ? "وضع التجربة: البيانات تُحفظ في هذا المتصفح فقط."
  : askEmail ? "أدخل بريد حساب المالك وكلمة مروره في Supabase." : "أدخل كلمة مرور حساب المالك.";
$("#loginForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const btn=$("#loginBtn"); btn.disabled=true; $("#loginErr").textContent="";
  if (askEmail && !/^\S+@\S+\.\S+$/.test($("#em").value.trim())){ $("#loginErr").textContent="اكتب البريد الإلكتروني لحساب المالك."; btn.disabled=false; $("#em").focus(); return; }
  try { await FB_API.signIn($("#pw").value, askEmail ? $("#em").value.trim() : undefined); $("#pw").value=""; await start(); }
  catch(err){
    const m=String(err?.message||err);
    $("#loginErr").textContent =
      m.includes("not_admin") ? "كلمة المرور صحيحة، لكن هذا الحساب غير مربوط باللوحة: شغّل supabase/owner.sql بهذا البريد." :
      /Email not confirmed/i.test(m) ? "البريد غير مؤكَّد: في Supabase ← Authentication ← Users، أكّد المستخدم أو أنشئه من جديد مع Auto Confirm User." :
      /could not find|PGRST202|is_admin/i.test(m) ? "قاعدة البيانات غير مجهّزة: شغّل supabase/setup.sql في SQL Editor." :
      m.includes("network")||m.includes("fetch") ? "تعذّر الاتصال. تحقّق من الإنترنت ثم أعد المحاولة." :
      askEmail ? "البريد أو كلمة المرور غير صحيحة." : "كلمة المرور غير صحيحة.";
  } finally { btn.disabled=false; }
});
/* connection check: tests the real Supabase project from this browser, changes nothing */
const DIAG = {
  url:["عنوان المشروع في config.js", "يجب أن يكون مثل https://xxxxxxxxxxxxxxxxxxxx.supabase.co (Project Settings ← Data API ← Project URL)."],
  key:["المفتاح العام في config.js", "يجب أن يبدأ بـ sb_publishable_ (Project Settings ← API Keys ← Publishable key). لا تضع أبداً مفتاحاً يبدأ بـ sb_secret_."],
  library:["تحميل مكتبة Supabase من الموقع", "الملف assets/vendor/supabase.js لم يُرفع مع الموقع. أعد رفع مجلد dist كاملاً."],
  reach:["الاتصال بالمشروع والمفتاح", ""],
  wilayas:["جدول الولايات", ""], communes:["البلديات", ""], products:["المنتجات الظاهرة في المتجر", ""], rates:["أسعار التوصيل", ""],
  reviews:["جدول الآراء", "شغّل supabase/setup.sql مرة أخرى (آمن، لا يحذف شيئاً)."],
  track:["دالة تتبع الطلب", "شغّل supabase/setup.sql في SQL Editor."],
  order:["دالة إرسال الطلبات", "شغّل supabase/setup.sql في SQL Editor."],
  bucket:["مخزن صور المنتجات", "شغّل supabase/setup.sql في SQL Editor."],
  demo:["الموقع في وضع التجربة", "config.js لا يحتوي عنوان Supabase ومفتاحه."]
};
function diagAdvice(d){
  const e = d.error;
  if (d.key==="reach"){
    if (/Invalid API key|No API key|401|JWT|apikey/i.test(e)) return "المفتاح غير مقبول: انسخ Publishable key من Project Settings ← API Keys وضعه في assets/config.js، ثم أعد النشر.";
    if (/PGRST205|42P01|does not exist|schema cache/i.test(e)) return "الجداول غير موجودة: شغّل الملف supabase/setup.sql كاملاً في SQL Editor.";
    if (/42501|permission denied/i.test(e)) return "الصلاحيات ناقصة: شغّل supabase/setup.sql مرة أخرى (آمن، لا يحذف شيئاً).";
    if (/fetch|network|Load failed|NetworkError/i.test(e)) return "لا يصل المتصفح إلى Supabase: تحقّق من الإنترنت، ومن أن المشروع غير متوقف (Paused) في لوحة Supabase، ومن عنوان المشروع.";
    return "تعذّر الاتصال.";
  }
  if (/PGRST20[25]|42P01|42883|does not exist|schema cache|Could not find/i.test(e)) return "غير موجود في قاعدة البيانات: شغّل supabase/setup.sql في SQL Editor.";
  if (/42501|permission denied/i.test(e)) return "الصلاحيات ناقصة: شغّل supabase/setup.sql مرة أخرى.";
  return DIAG[d.key]?.[1] || "";
}
$("#diagBtn").onclick = async e=>{
  const btn = e.currentTarget, box = $("#diag");
  btn.disabled = true; box.hidden = false; box.innerHTML = `<li class="wait">جارٍ الفحص…</li>`;
  let steps; try { steps = await FB_API.diagnose(); } catch(err){ steps = [{key:"reach", ok:false, error:String(err?.message||err)}]; }
  const info = d=>{
    if (!d.ok) return `${esc(diagAdvice(d))}${d.error?` <code>${esc(d.error.slice(0,160))}</code>`:""}`;
    if (d.key==="wilayas") return d.info==="69" ? "69 ولاية" : `${esc(d.info)} فقط من 69: شغّل supabase/setup.sql مرة أخرى.`;
    if (d.key==="communes") return +d.info>=1541 ? `${esc(d.info)} بلدية` : `${esc(d.info)} فقط: شغّل supabase/setup.sql مرة أخرى.`;
    if (d.key==="products") return +d.info ? `${esc(d.info)} قطعة` : "لا توجد قطع ظاهرة بعد: أضفها من تبويب المنتجات بعد الدخول.";
    if (d.key==="rates") return +d.info ? `${esc(d.info)} سعر` : "لم تُدخل أسعار التوصيل بعد (تبويب التوصيل).";
    if (d.key==="url") return `<code>${esc(d.info)}</code>`;
    if (d.key==="key") return `<code>${esc(d.info)}</code>`;
    return "";
  };
  const warn = d=>d.ok && ((d.key==="wilayas" && d.info!=="69") || (d.key==="communes" && +d.info<1541));
  box.innerHTML = steps.map(d=>`<li class="${d.ok&&!warn(d)?"":"bad"}"><span>${esc(DIAG[d.key]?.[0]||d.key)}</span>${info(d)?`<small>${info(d)}</small>`:""}</li>`).join("")
    + (steps.every(d=>d.ok&&!warn(d)) ? `<li><span>الاتصال سليم.</span><small>إن رُفض الدخول بعد ذلك: تأكد من البريد وكلمة المرور، ومن تشغيل supabase/owner.sql ببريد المالك نفسه.</small></li>` : "");
  btn.disabled = false;
};
$("#logout").onclick = async ()=>{ await FB_API.signOut(); location.reload(); };

async function start(){
  $("#login").hidden = true; $("#app").hidden = false;
  $("#modePill").textContent = FB_API.mode==="demo" ? "وضع التجربة" : "متصل";
  $("#modePill").className = "pill " + (FB_API.mode==="demo" ? "st" : "st-delivered");
  $("#main").innerHTML = `<p class="muted">جارٍ تحميل البيانات…</p>`;
  try { D = await FB_API.adminLoad(); }
  catch(e){ $("#main").innerHTML = `<p class="err">${esc(errText(e))}</p>`; return; }
  ZR = await FB_API.courierGet().catch(()=>null);   // null: the database does not have the ZR part yet
  const h = location.hash.slice(1); if (TABS.some(t=>t[0]===h)) tab = h;
  render();
  if (ZR?.enabled) zrSync(false);
  listenForOrders();
}
async function reload(){ D = await FB_API.adminLoad(); }

/* ---------- shell ---------- */
function render(){
  const counts = {orders: D.orders.filter(o=>o.status==="received").length, reviews: (D.reviews||[]).filter(r=>r.status==="pending").length};
  $("#tabs").innerHTML = TABS.map(([k,l])=>`<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k===tab}">${l}${counts[k]?`<span class="count num">${counts[k]}</span>`:""}</button>`).join("");
  $("#main").onclick = null; $("#main").onchange = null; $("#main").oninput = null;
  ({overview:renderOverview, orders:renderOrders, products:renderProducts, racks:renderRacks, reviews:renderReviews, shipping:renderShipping, site:renderSite, account:renderAccount})[tab]();
}
$("#tabs").addEventListener("click", async e=>{
  const b=e.target.closest("[data-tab]"); if(!b) return;
  if (tab==="racks" && b.dataset.tab!=="racks") rk = null;
  tab=b.dataset.tab; try{history.replaceState(null,"","#"+tab)}catch{}
  render(); window.scrollTo(0,0);
  // fetch fresh orders and stock in the background, then redraw the same tab
  const was = tab; try { await reload(); } catch { return; }
  if (tab===was && !$("#editor").open && ["overview","orders","products"].includes(tab) || tab===was && tab==="reviews" && !ui.revForm) render();
});
document.addEventListener("visibilitychange", async ()=>{
  if (document.hidden || !D || $("#editor").open || !["overview","orders"].includes(tab)) return;
  try { await reload(); render(); } catch {}
});

/* ================= overview ================= */
const DAY = 864e5;
function periodStart(p){
  const d = new Date(); d.setHours(0,0,0,0);
  if (p==="today") return d;
  if (p==="month") return new Date(d.getFullYear(), d.getMonth(), 1);
  return new Date(d - (+p-1)*DAY);
}
const isActive = o=>!FB.RELEASES.includes(o.status);
const stLabel = s=>FB.STATUSES[s]?.ar || s;
const fullName = o=>`${o.first_name||""} ${o.last_name||""}`.trim() || o.customer_name || "";
function renderOverview(){
  const from = periodStart(ui.period);
  const inP = D.orders.filter(o=>new Date(o.created_at) >= from);
  const active = inP.filter(isActive);
  const delivered = inP.filter(o=>o.status==="delivered");
  const sales = sum(active,o=>o.total), collected = sum(delivered,o=>o.total);
  const profit = sum(delivered,o=>o.subtotal-o.cost_total);
  const waiting = D.orders.filter(o=>o.status==="received").length;
  const pendingShip = D.orders.filter(o=>o.shipping_pending && isActive(o)).length;
  const low = D.products.flatMap(p=>p.sizes.map(s=>[p,s,FB.stockOf(p,s)])).filter(([,,n])=>n!=null&&n<=2);
  const counts = {}; inP.forEach(o=>counts[o.status]=(counts[o.status]||0)+1);

  // top products / wilayas in the period
  const byProd = {}, byW = {};
  active.forEach(o=>{
    (o.order_items||[]).forEach(l=>{ const k=l.product_id; byProd[k] ||= {name:l.name?.ar||k,qty:0,rev:0}; byProd[k].qty+=l.qty; byProd[k].rev+=l.unit_price*l.qty; });
    const w=o.wilaya_code; byW[w] ||= {name:`${String(w).padStart(2,"0")} ${FB.wilaya(w)?.[1]||o.wilaya_name||""}`,n:0,rev:0}; byW[w].n++; byW[w].rev+=o.total;
  });
  const topP = Object.values(byProd).sort((a,b)=>b.qty-a.qty||b.rev-a.rev).slice(0,6);
  const topW = Object.values(byW).sort((a,b)=>b.n-a.n).slice(0,6);
  const rank = (list, val, sub) => list.length ? `<ol class="rank">${list.map(x=>`<li><span>${esc(x.name)}</span><span class="num">${val(x)}</span><span class="bar"><i style="width:${Math.max(4,val.raw(x)/val.raw(list[0])*100)}%"></i></span>${sub?`<small class="muted small" style="grid-column:1/-1">${sub(x)}</small>`:""}</li>`).join("")}</ol>` : `<p class="empty">لا توجد طلبات في هذه الفترة.</p>`;
  const qtyVal = Object.assign(x=>`${x.qty} قطعة`,{raw:x=>x.qty});
  const nVal = Object.assign(x=>`${x.n} طلب`,{raw:x=>x.n});

  $("#main").innerHTML = `<section class="panel">
    <div class="panel-head"><h2>نظرة عامة</h2>
      <div class="chips" id="period">${[["today","اليوم"],["7","7 أيام"],["30","30 يوماً"],["month","هذا الشهر"]].map(([k,l])=>`<button class="chip" type="button" data-p="${k}" aria-pressed="${ui.period===k}">${l}</button>`).join("")}</div>
    </div>
    ${waiting?`<div class="banner"><span><b class="num">${waiting}</b> ${waiting===1?"طلب جديد ينتظر":"طلبات جديدة تنتظر"} الاتصال والتأكيد.</span><button class="btn btn-primary btn-sm" type="button" data-go="received">عرض الطلبات الجديدة</button></div>`:""}
    ${pendingShip?`<div class="banner"><span><b class="num">${pendingShip}</b> ${pendingShip===1?"طلب سعرُ توصيله":"طلبات سعرُ توصيلها"} غير محدد بعد. حدّده من تفاصيل الطلب بعد الاتفاق مع الزبونة.</span><button class="btn btn-ghost btn-sm" type="button" data-go="pendingShip">عرضها</button></div>`:""}
    <div class="kpis">
      <div class="kpi"><span class="label">المبيعات</span><span class="value">${money(sales)}</span><span class="sub">${active.length} طلب، دون الملغاة والتي تعذّر تسليمها</span></div>
      <div class="kpi"><span class="label">المبلغ المُحصَّل</span><span class="value">${money(collected)}</span><span class="sub">${delivered.length} طلب تم تسليمه ودفعه</span></div>
      <div class="kpi"><span class="label">الربح التقريبي</span><span class="value">${money(profit)}</span><span class="sub">من الطلبات المُسلَّمة، بعد سعر الشراء ودون التوصيل</span></div>
      <div class="kpi"><span class="label">عدد الطلبات</span><span class="value num">${inP.length}</span><span class="sub">متوسط الطلب ${money(active.length?sales/active.length:0)}</span></div>
    </div>
    <div class="box"><h3>الطلبات حسب الحالة في هذه الفترة</h3>
      <div class="status-grid">${Object.keys(FB.STATUSES).map(s=>`<button type="button" class="status-cell" data-go="${s}"><span class="pill st-${s} st">${stLabel(s)}</span><b class="num">${counts[s]||0}</b></button>`).join("")}</div>
    </div>
    <div class="box"><h3>المبيعات اليومية</h3><div class="chart-wrap" id="chart"></div></div>
    <div class="two-col">
      <div class="box"><h3>الأكثر مبيعاً</h3>${rank(topP,qtyVal,x=>money(x.rev))}</div>
      <div class="box"><h3>الطلبات حسب الولاية</h3>${rank(topW,nVal,x=>money(x.rev))}</div>
    </div>

// one series (daily sales), one hue, no legend; hover or focus a day to read its value
function drawChart(from){
  const start = ui.period==="today" ? new Date(+periodStart("7")) : from;
  const days = Math.max(1, Math.round((periodStart("today") - start)/DAY) + 1);
  const vals = Array.from({length:days},(_,i)=>({d:new Date(+start+i*DAY),v:0,n:0}));
  D.orders.forEach(o=>{ if(!isActive(o)) return; const i=Math.floor((new Date(o.created_at)-start)/DAY); if(i>=0&&i<days){ vals[i].v+=o.total; vals[i].n++; } });
  const W=720, H=230, L=56, R=8, T=12, B=28, max=Math.max(...vals.map(x=>x.v),1);
  const step = 10**Math.floor(Math.log10(max)), top = Math.ceil(max/step)*step;
  const y = v=>T+(H-T-B)*(1-v/top), bw=(W-L-R)/days, gap=Math.min(6,bw*.3);
  const short = v=>v>=1000?`${Math.round(v/100)/10} ألف`:String(v);
  const dm = d=>`${d.getDate()}/${d.getMonth()+1}`;
  const every = Math.ceil(days/8);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="المبيعات اليومية" dir="ltr">`;
  [0,.5,1].forEach(f=>{ const v=top*f; svg+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="currentColor" stroke-opacity=".12"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="currentColor" fill-opacity=".6">${short(v)}</text>`; });
  vals.forEach((x,i)=>{
    const bx=L+i*bw+gap/2, w=Math.max(1,bw-gap), h=Math.max(0,y(0)-y(x.v)), r=Math.min(4,w/2,h);
    if (h>0) svg+=`<path d="M${bx} ${y(0)}V${y(x.v)+r}q0 ${-r} ${r} ${-r}h${w-2*r}q${r} 0 ${r} ${r}V${y(0)}Z" style="fill:var(--mulberry)"/>`;
    if ((days-1-i)%every===0) svg+=`<text x="${bx+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor" fill-opacity=".6">${dm(x.d)}</text>`;
    svg+=`<rect class="hit" data-i="${i}" x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent" tabindex="0"/>`;
  });
  svg += `<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" stroke-opacity=".35"/></svg><div class="tip" id="tip"></div>`;
  const box=$("#chart"); box.innerHTML=svg;
  const tip=$("#tip");
  const show = el=>{ const x=vals[+el.dataset.i], r=el.getBoundingClientRect(), b=box.getBoundingClientRect();
    tip.textContent=`${dm(x.d)}: ${money(x.v)} (${x.n} طلب)`; tip.style.left=`${r.left-b.left+r.width/2}px`; tip.style.top=`${Math.max(30,y(x.v)/H*b.height)}px`; tip.classList.add("on"); };
  box.querySelectorAll(".hit").forEach(el=>{ el.addEventListener("pointerenter",()=>show(el)); el.addEventListener("focus",()=>show(el)); });
  box.addEventListener("pointerleave",()=>tip.classList.remove("on"));
  box.addEventListener("focusout",()=>tip.classList.remove("on"));
}

const fmtDate = s=>{ const d=new Date(s), p=n=>String(n).padStart(2,"0"); return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`; };

/* ---------- the customer's history: her other orders, by phone number ----------
   A refused delivery ("failed") is the costly case with payment on delivery, so it stands out. */
function historyOf(o){
  const nums = new Set([o.phone, o.phone2, o.whatsapp].filter(Boolean));
  const others = D.orders.filter(x=>x.id!==o.id && (nums.has(x.phone) || (x.phone2 && nums.has(x.phone2))))
    .sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  const n = st=>others.filter(x=>x.status===st).length;
  return {others, failed:n("failed"), cancelled:n("cancelled"), delivered:n("delivered"),
    open:others.filter(x=>!["delivered","failed","cancelled"].includes(x.status)).length};
}
function historyBadge(h){
  if (h.failed) return `<span class="pill st-failed st hist" title="طلبات سابقة لم تُستلم">⚠️ رفضت الاستلام ${h.failed===1?"مرة":h.failed===2?"مرتين":h.failed+" مرات"}</span>`;

  if (!h.others.length) return `<span class="pill hist muted">أول طلب</span>`;
  return "";
}

const ZR_STEPS = {check:"التحقق من أنه لم يُرسل من قبل…", places:"مطابقة الولاية والبلدية مع ZR…", send:"إرسال الطرد…", read:"قراءة رقم التتبع…"};
const ZR_NEED = {wilaya:"لم أجد ولاية الزبونة في قائمة ZR بشكل مؤكد. اختر الولاية كما تسمّيها ZR:",
  commune:"لم أجد بلدية الزبونة في قائمة ZR بشكل مؤكد. اختر البلدية كما تسمّيها ZR:",
  desk:"في هذه الولاية أكثر من مكتب ZR. اختر المكتب الذي ستستلم منه الزبونة:"};
async function zrSend(id, btn){
  const o = D.orders.find(x=>x.id===id), box = $("#zrc-"+id), label = btn.textContent;
  btn.disabled = true;
  try {
    const r = await FB_API.courierSend(o, zrChoice[id] || {}, step=>{ btn.textContent = ZR_STEPS[step] || label; });
    if (r.need){
      box.innerHTML = `<div class="field"><label for="zrsel-${id}">${ZR_NEED[r.need]}</label>
        <select id="zrsel-${id}"><option value="">اختر…</option>${r.options.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select></div>
        <button class="btn btn-ghost btn-sm" type="button" data-zr-pick="${id}" data-need="${r.need}">متابعة الإرسال</button>`;
      zrChoice[id] = {...(zrChoice[id]||{}), ...(r.wilaya?{wilaya:r.wilaya}:{}), ...(r.commune?{commune:r.commune}:{})};
      return;
    }
    delete zrChoice[id];
    toast(r.already ? `هذا الطلب مسجّل عند ZR من قبل: ${r.tracking}` : `أُرسل إلى ZR Express. رقم التتبع: ${r.tracking}`);
    await reload(); render();
  } catch(e){ toast(errText(e), true); }
  finally { if (btn.isConnected){ btn.disabled = false; btn.textContent = label; } }
}
// ask ZR about parcels on their way, then read the answers a few seconds later
let zrBusy = false;
async function zrSync(manual, btn){
  if (zrBusy) return; zrBusy = true;
  const label = btn?.textContent; if (btn){ btn.disabled = true; btn.textContent = "جارٍ السؤال عند ZR…"; }
  try {
    const a = await FB_API.courierSync();
    if (a.asked) await new Promise(ok=>setTimeout(ok, 6000));
    const b = a.asked ? await FB_API.courierSync() : {read: 0};
    const before = JSON.stringify(D.orders.map(o=>[o.id,o.status,o.courier_stage]));
    await reload();
    const changed = before !== JSON.stringify(D.orders.map(o=>[o.id,o.status,o.courier_stage]));
    if (manual) toast(a.off ? "الربط مع ZR غير مفعّل." : `تم. ${(a.read||0)+(b.read||0)} طرد قُرئت حالته.`);
    // never redraw under the owner's typing
    if (changed && ["orders","overview"].includes(tab) && !$("#main").contains(document.activeElement)) render();
  } catch(e){ if (manual) toast(errText(e), true); }
  finally { zrBusy = false; if (btn?.isConnected){ btn.disabled = false; btn.textContent = label; } }
}

// a customer receipt built from the order record, in the customer's own language
function orderReceipt(o){
  const lang = o.lang === "fr" ? "fr" : "ar", s = D.settings || {};
  const loc = v => (v && typeof v === "object") ? (v[lang] || v.ar || "") : (v || "");
  const tu = lang === "fr" ? "Taille unique" : "مقاس موحد";
  const ig = (s.socials?.instagram||"").replace(/[?#].*$/,"").replace(/\/+$/,"").split("/").pop();
  return {
    number:o.order_number, tracking:o.tracking_code, date:o.created_at,
    customer:{name:fullName(o), phone:FB.normPhone(o.phone)},
    delivery:{method:o.delivery, wilaya:`${String(o.wilaya_code).padStart(2,"0")} ${o.wilaya_name||""}`.trim(),
      commune:o.commune_name||"", address:o.delivery==="home"?(o.address||""):""},
    lines:(o.order_items||[]).map(l=>({name:loc(l.name)||l.product_id,
      variant:[loc(l.color), l.size==="TU"?tu:l.size].filter(Boolean).join("، "), qty:l.qty, unit:l.unit_price})),
    subtotal:o.subtotal, shipping:o.shipping, shipping_pending:o.shipping_pending, total:o.total,
    shop:{phone:s.phone_display, address:(s.address?.[lang]||s.address?.ar||""), instagram:ig, site:location.host}
  };
}
document.addEventListener("click", async e=>{
  const st = e.target.closest("[data-status]"), nb = e.target.closest("[data-note]"), sb = e.target.closest("[data-ship]");
  const bl = e.target.closest("[data-block]"), ub = e.target.closest("[data-unblock]"), rc = e.target.closest("[data-receipt]");
  if (rc){ const o = D.orders.find(x=>x.id===+rc.dataset.receipt); if (o) FB.printReceipt(orderReceipt(o), o.lang==="fr"?"fr":"ar"); return; }
  if (bl){
    if (!bl.classList.contains("armed")){ bl.classList.add("armed"); bl.textContent = "اضغط مرة أخرى للتأكيد"; return; }
    const o = D.orders.find(x=>x.id===+bl.dataset.block);
    if (await act(bl, async ()=>{
      await FB_API.blockPhone(o.phone, `طلب وهمي ${o.order_number||""}`);
      if (["received","contacting","confirmed"].includes(o.status)) await FB_API.setOrderStatus(o.id, "cancelled", "طلب وهمي: حُظر الرقم");
      await reload();
    }, "حُظر الرقم. القطع المحجوزة عادت إلى المخزون.")) render();
  }
  if (ub){ if (await act(ub, async ()=>{ await FB_API.unblockPhone(ub.dataset.unblock); await reload(); }, "رُفع الحظر عن الرقم.")) render(); }
  if (st){
    const id = +st.dataset.status, status = $("#st-"+id).value, note = $("#sn-"+id).value.trim(), o = D.orders.find(o=>o.id===id);
    if (status===o.status && !note){ toast("اختر حالة مختلفة عن الحالية.", true); return; }
    if (status===o.status){ toast("الحالة نفسها: لتسجيل ملاحظة فقط استعمل الملاحظة الداخلية.", true); return; }
    if (await act(st, async ()=>{ await FB_API.setOrderStatus(id, status, note); await reload(); }, `تم تحديث الحالة إلى «${stLabel(status)}».`)) render();
  }
  if (nb){
    const id = +nb.dataset.note, note = $("#nt-"+id).value;
    await act(nb, async ()=>{ await FB_API.updateOrder(id,{admin_note:note}); D.orders.find(o=>o.id===id).admin_note=note; }, "تم حفظ الملاحظة.");
  }
  if (sb){
    const id = +sb.dataset.ship, v = $("#sh-"+id).value;
    if (v==="" || +v<0){ toast("اكتب سعر التوصيل بالدينار.", true); return; }

  }
});
function exportCsv(list){

    (o.order_items||[]).map(l=>`${l.name?.ar||l.product_id} ${l.size} x${l.qty}`).join(" + "),o.subtotal,o.shipping_pending?"يحتاج تأكيد":o.shipping,o.total,o.subtotal-o.cost_total]));

// read the form back into `ed` before any re-draw so nothing typed is lost
function collect(){
  const v = id=>$("#"+id).value.trim(), n = id=>Math.max(0,Math.round(+$("#"+id).value||0));
  ed.name = {ar:v("e-nar"), fr:v("e-nfr")};
  ed.description = {ar:v("e-dar"), fr:v("e-dfr")};
  ed.price = n("e-price"); ed.compare_price = n("e-cmp")||null; ed.cost = n("e-cost");
  ed.category = $("#e-cat").value; ed.badge = $("#e-badge").value||null; ed.type = $("#e-type").value;
  $$("#edForm [data-c]").forEach(el=>{ ed.colors[+el.dataset.c][el.dataset.k] = el.value.trim(); });
  ed.sizes = [...new Set(v("e-sizes").split(/[,،]/).map(s=>s.trim()).filter(Boolean))];
  const old = ed.stock || {};
  $$("#edForm [data-stock]").forEach(el=>{ old[el.dataset.stock] = Math.max(0,Math.round(+el.value||0)); });
  ed.stock = $("#e-track").checked ? Object.fromEntries(ed.sizes.map(s=>[s, old[s]??0])) : null;
  ed.active = $("#e-active").checked;
}

// a photo without background has see-through corners; one with its background does not
async function clearEdges(file){
  try {
    const img = await createImageBitmap(file), c = document.createElement("canvas"); c.width = 40; c.height = 40;
    const x = c.getContext("2d"); x.drawImage(img, 0, 0, 40, 40);
    return [[0,0],[39,0],[0,39],[39,39],[20,0]].every(([a,b])=>x.getImageData(a,b,1,1).data[3] < 30);
  } catch { return true; }
}
// the part of a picture that is not see-through (measured on a small copy), with a thin margin; null if all of it is
function alphaBox(img){
  const k = Math.min(1, 400/Math.max(img.width, img.height)), w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d", {willReadFrequently: true}); x.drawImage(img, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let i = 0; i < w; i++) if (d[(y*w + i)*4 + 3] > 16){ if (i < x0) x0 = i; if (i > x1) x1 = i; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  if (x1 < 0 || (x0 <= 1 && y0 <= 1 && x1 >= w-2 && y1 >= h-2)) return null;
  const pad = 2, X = Math.max(0, (x0 - pad)/k), Y = Math.max(0, (y0 - pad)/k);
  return {x: Math.floor(X), y: Math.floor(Y), w: Math.ceil(Math.min(img.width, (x1 + 1 + pad)/k) - X), h: Math.ceil(Math.min(img.height, (y1 + 1 + pad)/k) - Y)};
}
// resize in the browser and save as WebP (it keeps transparency) so the store stays light on phones
async function shrink(file, max, trim = false){
  const img = await createImageBitmap(file);
  const box = (trim && alphaBox(img)) || {x: 0, y: 0, w: img.width, h: img.height};
  const k = Math.min(1, max/Math.max(box.w, box.h));
  const c = document.createElement("canvas"); c.width = Math.round(box.w*k); c.height = Math.round(box.h*k);
  c.getContext("2d").drawImage(img, box.x, box.y, box.w, box.h, 0, 0, c.width, c.height);
  return new Promise((res, rej)=>c.toBlob(b=>b?res(b):rej(new Error("encode")), "image/webp", .82));
}

/* ================= racks =================
   The owner makes racks for the home page: a name, the pieces in order, shown or hidden. Only pieces with a
   picture without background can hang. With no rack made, the store shows one rack with every such piece.
   Changes stay here until «حفظ الرفوف». */
const canHang = p=>!!(p.cutout?.front || p.colors?.some(c=>c.cutout));
const hangPic = p=>p.cutout?.front || p.colors?.find(c=>c.cutout)?.cutout || "";
let rk = null;   // the racks being edited: {on, list}
function renderRacks(){
  rk ||= {on: D.settings.racks_on !== false, list: clone(D.settings.racks || [])};
  rk.list.forEach(r=>{ r.items ||= []; r.name ||= {ar:"", fr:""}; });
  const pieces = D.products.filter(canHang), missing = D.products.filter(p=>!canHang(p));
  const pName = id=>D.products.find(p=>p.id===id)?.name.ar;
  const thumb = p=>`<div class="rk-pic">${hangPic(p)?`<img src="${esc(hangPic(p))}" alt="">`:""}</div>`;
  $("#main").innerHTML = `<section class="panel">
    <div class="panel-head"><h2>الرفوف</h2><div class="toolbar"><button class="btn btn-primary" type="button" id="rkAdd">إضافة رف</button></div></div>
    <p class="small muted">تظهر الرفوف في الصفحة الرئيسية بعد الفيديو، بهذا الترتيب. لا تُعلَّق على الرف إلا القطع التي لها <b>صورة بلا خلفية</b> (تبويب المنتجات ← تعديل ← «صور الرف»). القطع النافدة لا تظهر.</p>
    <label class="check"><input type="checkbox" id="rkOn" ${rk.on?"checked":""}> إظهار الرفوف في المتجر</label>
    ${!rk.list.length ? `<div class="box"><p>${pieces.length
        ? `لم تنشئ أي رف بعد، فيعرض المتجر رفاً واحداً تلقائياً فيه كل القطع ذات صور الرف (<span class="num">${pieces.length}</span>). أنشئ رفوفاً لتختار بنفسك اسم كل رف وقطعه وترتيبها.`
        : "لا توجد بعد قطع لها صورة بلا خلفية، فلا يظهر أي رف في المتجر."}</p></div>`
      : `<div class="rk-list">${rk.list.map((r,i)=>{
          const inRack = (r.items||[]).filter(id=>D.products.some(p=>p.id===id));
          const addable = pieces.filter(p=>!inRack.includes(p.id));
          return `<div class="box rk" data-rk="${i}">
          <div class="rk-head">
            <div class="field"><label>اسم الرف بالعربية</label><input data-k="ar" value="${esc(r.name?.ar||"")}" placeholder="مثلاً: رف العبايات"></div>
            <div class="field"><label>بالفرنسية (اختياري)</label><input data-k="fr" dir="ltr" value="${esc(r.name?.fr||"")}" placeholder="Abayas"></div>
            <div class="toolbar"><button class="icon" type="button" data-rkmove="-1" aria-label="تقديم الرف" ${i===0?"disabled":""}>↑</button><button class="icon" type="button" data-rkmove="1" aria-label="تأخير الرف" ${i===rk.list.length-1?"disabled":""}>↓</button>
              <label class="check small"><input type="checkbox" data-k="active" ${r.active!==false?"checked":""}> ظاهر</label>

          </div>

    const mv = e.target.closest("[data-rkmove]");

    }

      if (await act(e.target, ()=>FB_API.saveSettings(next), "تم حفظ الرفوف.")){ D.settings = next; rk = null; renderRacks(); }
    }
  };
}

          <span class="num">${new Date(r.created_at).toLocaleDateString("fr-FR")}</span><span>${r.verified?"مشترية مؤكدة":"أضفته أنت"}</span>
          ${r.order_id&&D.orders.find(o=>o.id===r.order_id)?`<span>الطلب <span class="num">${esc(D.orders.find(o=>o.id===r.order_id).order_number)}</span></span>`:""}</div>
      </div>
      <div class="acts">
        ${r.status!=="approved"?`<button class="btn btn-primary btn-sm" type="button" data-rset="approved" data-id="${r.id}">نشر</button>`:""}
        ${r.status!=="hidden"?`<button class="btn btn-ghost btn-sm" type="button" data-rset="hidden" data-id="${r.id}">إخفاء</button>`:""}
        <button class="btn btn-danger btn-sm" type="button" data-rdel="${r.id}">حذف</button>
      </div></div>`).join("")}</div>`
      : `<div class="box"><p class="muted">${ui.revStatus==="pending"?"لا توجد آراء تنتظر المراجعة.":ui.revStatus==="approved"?"لا توجد آراء منشورة بعد.":"لا توجد آراء مخفية."}</p></div>`}
  </section>`;
  const keep = ()=>{ if (!ui.revForm) return; Object.assign(ui.revForm, {name:$("#rv-name").value, wilaya_name:$("#rv-w").value, rating:+$("#rv-rating").value,
    product_id:$("#rv-prod").value, body:$("#rv-body").value}); };
  $("#addRev").onclick = ()=>{ ui.revForm ||= {name:"", wilaya_name:"", rating:5, product_id:"", body:"", photo:""}; renderReviews(); $("#rv-name").focus(); };
  $("#main").onclick = async e=>{
    const ch = e.target.closest("[data-rs]"); if (ch){ keep(); ui.revStatus = ch.dataset.rs; return renderReviews(); }
    if (e.target.id==="rvCancel"){ ui.revForm = null; return renderReviews(); }
    if (e.target.id==="rv-nophoto"){ keep(); ui.revForm.photo = ""; return renderReviews(); }
    const st = e.target.closest("[data-rset]");
    if (st && await act(st, async ()=>{ await FB_API.setReviewStatus(+st.dataset.id, st.dataset.rset); await reload(); }, st.dataset.rset==="approved" ? "نُشر الرأي في المتجر." : "أُخفي الرأي من المتجر.")) { keep(); render(); }
    const del = e.target.closest("[data-rdel]");
    if (del){
      if (!del.classList.contains("armed")){ del.classList.add("armed"); del.textContent = "تأكيد الحذف"; return; }
      if (await act(del, async ()=>{ await FB_API.deleteReview(+del.dataset.rdel); await reload(); }, "حُذف الرأي.")) { keep(); render(); }
    }
  };
  $("#rv-photo")?.addEventListener("change", async e=>{
    const file = e.target.files[0]; if (!file) return;
    keep(); $("#rvErr").textContent = "جارٍ تجهيز الصورة ورفعها…"; $("#rvSave").disabled = true;
    try { ui.revForm.photo = await FB_API.uploadImage(await shrink(file, FB_API.mode==="demo" ? 640 : 1200)); renderReviews(); }
    catch { $("#rvErr").textContent = "تعذّر رفع الصورة. جرّب صورة بصيغة JPG أو PNG."; $("#rvSave").disabled = false; }
  });
  $("#revForm")?.addEventListener("submit", async e=>{
    e.preventDefault(); keep();
    const f = ui.revForm;
    const err = f.name.trim().length < 2 ? "اكتب اسم الزبونة (حرفان على الأقل)." : !f.body.trim() && !f.photo ? "اكتب نص الرأي أو أضف صورته." : "";
    if (err){ $("#rvErr").textContent = err; return; }
    if (await act($("#rvSave"), async ()=>{ await FB_API.addReview(f); await reload(); }, "نُشر الرأي في المتجر.")){ ui.revForm = null; ui.revStatus = "approved"; render(); }
  });
}

/* ================= shipping =================
   One price row per wilaya, optional rows per commune that override it.
   An empty price means "not set yet": the store shows that the price needs confirmation. Nothing is assumed. */
const priceIn = (k, v, label) => `<input type="number" min="0" step="50" inputmode="numeric" data-k="${k}" value="${v ?? ""}" placeholder="—" aria-label="${esc(label)}">`;
const availIn = (k, on, label) => `<label class="check"><input type="checkbox" data-k="${k}" ${on!==false?"checked":""}><span class="sr">${esc(label)}</span></label>`;
function readRow(tr, w, scope){
  const g = k=>tr.querySelector(`[data-k="${k}"]`), num = k=>g(k).value==="" ? null : Math.max(0, Math.round(+g(k).value));
  return {wilaya_code:w, scope, home_price:num("home_price"), desk_price:num("desk_price"), home_available:g("home_available").checked, desk_available:g("desk_available").checked};
}

      const {rows, unknown, communes} = await FB_API.courierRates();

        tr.classList.add("from-zr"); filled++;
      }

        ${missing.length?`<p class="small muted">بلا سعر عند ZR (بقيت كما هي): ${missing.map(w=>`<span class="num">${w[0]}</span> ${esc(w[1])}`).join("، ")}</p>`:""}

        ${unknown.length?`<p class="small muted">لم أتعرف على: ${unknown.map(esc).join("، ")}</p>`:""}`

async function openCommuneRates(w){

  const base = D.rates[`${w}:0`] || {};
  box.innerHTML = `<h3>أسعار خاصة ببلديات ${esc(wl[1])}</h3>
    <p class="muted small">سعر الولاية: المنزل ${base.home_price!=null?money(base.home_price):"غير محدد"}، المكتب ${base.desk_price!=null?money(base.desk_price):"غير محدد"}. اترك الخانات فارغة ليُطبَّق سعر الولاية.</p>
    ${list.length?`<input class="search" id="cq" type="search" placeholder="بحث عن بلدية" style="margin-block:.6rem">
    <div class="table-scroll"><table>
      <thead><tr><th>البلدية</th><th>إلى المنزل (دج)</th><th>متاح</th><th>إلى المكتب (دج)</th><th>متاح</th></tr></thead>
      <tbody>${list.map(c=>{const r=D.rates[`${w}:${c.id}`]||{}; return `<tr data-c="${c.id}" data-name="${esc(FB.fold(c.ar+" "+c.fr))}">
        <td>${esc(c.ar)} <span class="small muted">${esc(c.fr)}</span></td>
        <td>${priceIn("home_price", r.home_price, c.ar+": المنزل")}</td><td>${availIn("home_available", r.home_available, c.ar+": المنزل متاح")}</td>
        <td>${priceIn("desk_price", r.desk_price, c.ar+": المكتب")}</td><td>${availIn("desk_available", r.desk_available, c.ar+": المكتب متاح")}</td></tr>`}).join("")}</tbody>
    </table></div>
    <div class="toolbar" style="margin-top:.8rem"><button class="btn btn-primary" type="button" id="saveCommunes">حفظ أسعار بلديات ${esc(wl[1])}</button></div>`
    : `<p class="muted">لا توجد بلديات مسجّلة لهذه الولاية بعد. أضفها من قسم «بلديات الولايات الجديدة» أدناه.</p>`}`;
  $("#cq")?.addEventListener("input", e=>{ const q=FB.fold(e.target.value); box.querySelectorAll("tr[data-c]").forEach(tr=>tr.hidden = !!q && !tr.dataset.name.includes(q)); });
  $("#saveCommunes")?.addEventListener("click", async e=>{
    const rows = [], remove = [];
    box.querySelectorAll("tr[data-c]").forEach(tr=>{
      const c = +tr.dataset.c, r = readRow(tr, w, c);
      if (isEmptyRate(r)){ if (D.rates[`${w}:${c}`]) remove.push([w,c]); } else rows.push(r);
    });
    if (await act(e.target, async ()=>{ await FB_API.saveRates(rows, remove); await reload(); }, "تم حفظ أسعار البلديات.")){
      const n = Object.keys(D.rates).filter(k=>k.startsWith(w+":") && !k.endsWith(":0")).length;
      const b = $(`[data-communes="${w}"]`); if (b) b.textContent = n ? `${n} استثناء` : "أسعار البلديات";
    }
  });
}
async function openNewWilaya(w){
  const wl = FB.wilaya(w), parent = FB.wilaya(wl[4]), box = $("#nwList");
  box.innerHTML = `<p class="muted small">جارٍ التحميل…</p>`;
  let mine, theirs;
  try { [mine, theirs] = await Promise.all([FB_API.communes(w), FB_API.communes(parent[0])]); } catch(e){ box.innerHTML = `<p class="err">${esc(errText(e))}</p>`; return; }
  const all = [...mine.map(c=>({...c, on:true})), ...theirs.map(c=>({...c, on:false}))].sort((a,b)=>a.fr.localeCompare(b.fr));
  box.innerHTML = `<p class="small" style="margin-block:.6rem">علّم البلديات التابعة لولاية ${esc(wl[1])}. غير المعلَّمة تبقى في ولاية ${esc(parent[1])}.</p>
    <div class="commune-picks">${all.map(c=>`<label class="check"><input type="checkbox" data-id="${c.id}" ${c.on?"checked":""}> ${esc(c.ar)} <span class="small muted">${esc(c.fr)}</span></label>`).join("")}</div>
    <div class="toolbar" style="margin-top:.8rem"><button class="btn btn-primary" type="button" id="saveMoves">حفظ بلديات ${esc(wl[1])}</button></div>`;
  $("#saveMoves").onclick = async e=>{
    const boxes = [...box.querySelectorAll("input[data-id]")];
    const toNew = boxes.filter(b=>b.checked && !mine.some(c=>c.id===+b.dataset.id)).map(b=>+b.dataset.id);
    const back = boxes.filter(b=>!b.checked && mine.some(c=>c.id===+b.dataset.id)).map(b=>+b.dataset.id);
    if (!toNew.length && !back.length){ toast("لم يتغير شيء."); return; }
    if (await act(e.target, async ()=>{
      if (toNew.length) await FB_API.moveCommunes(toNew, w);
      if (back.length) await FB_API.moveCommunes(back, parent[0]);
    }, `تم حفظ بلديات ${wl[1]}.`)) openNewWilaya(w);
  };
}

      <p class="small muted">التنسيق: سطر يبدأ بـ <b dir="ltr">##</b> يصبح عنواناً، وسطر يبدأ بـ <b dir="ltr">-</b> يصبح نقطة في قائمة.</p>
      <div class="grid2">
        <div class="field"><label for="s-pol-ar">النص بالعربية</label><textarea id="s-pol-ar" rows="14">${esc(s.policy.ar)}</textarea></div>

      </div>
      <div class="toolbar"><button class="btn btn-ghost btn-sm" type="button" id="polDraft">إدراج مسودة لأكملها</button>
        <span class="small muted">تضع المسودة بين معقوفين [ ] ما يجب أن تقرره أنت (المدة، الشروط، من يدفع التوصيل). لا تُحفظ الصفحة وفيها معقوفان.</span></div>
    </fieldset>
    <fieldset><legend>أقسام المتجر</legend>

      </div>`).join("")}</div>
      <button class="btn btn-ghost btn-sm" type="button" id="addCat" style="justify-self:start">إضافة قسم</button>

      <button class="link" type="button" id="resetTexts" style="justify-self:start">إرجاع النصوص الأصلية</button>
    </fieldset>
    <div class="savebar"><button class="btn btn-primary" type="button" id="saveSite">حفظ الإعدادات</button></div>
  </section>`;
  const readCats = ()=>$$("#cats .cat-row").map(r=>({id:r.dataset.cat, ar:r.querySelector('[data-k="ar"]').value.trim(), fr:r.querySelector('[data-k="fr"]').value.trim()}));
  const gather = ()=>{
    const v = id=>$("#"+id).value.trim(), L = id=>({ar:v(id+"-ar"), fr:v(id+"-fr")});
    return {...D.settings, whatsapp:v("s-wa").replace(/\D/g,""), phone_display:v("s-ph"), address:L("s-addr"), hours:L("s-hours"), map_url:v("s-map"),
      socials:{instagram:v("s-ig"), facebook:v("s-fb"), tiktok:v("s-tt")}, categories:readCats(),
      policy:{ar:$("#s-pol-ar").value.trim(), fr:$("#s-pol-fr").value.trim()},
      pixels:{facebook:v("s-fbpx").replace(/\s/g,""), tiktok:v("s-ttpx").replace(/\s/g,"").toUpperCase()},
      texts:Object.fromEntries(Object.keys(FB.TEXT_LABELS).map(k=>[k, L("t-"+k)]))};
  };
  $("#main").onclick = e=>{
    if (e.target.id==="addCat"){ D.settings = gather(); D.settings.categories.push({id:"c-"+Date.now().toString(36), ar:"", fr:""}); renderSite(); $$("#cats .cat-row").pop().querySelector("input").focus(); }
    const up = e.target.closest("[data-cup]"); if (up){ D.settings = gather(); const c=D.settings.categories, i=+up.dataset.cup; [c[i-1],c[i]]=[c[i],c[i-1]]; renderSite(); }
    const del = e.target.closest("[data-cdel]"); if (del){ D.settings = gather(); D.settings.categories.splice(+del.dataset.cdel,1); renderSite(); }
    if (e.target.id==="polDraft"){
      const ar = $("#s-pol-ar"), fr = $("#s-pol-fr");
      if ((ar.value.trim() || fr.value.trim()) && !e.target.classList.contains("armed")){ e.target.classList.add("armed"); e.target.textContent = "اضغط مرة أخرى لاستبدال النص الحالي بالمسودة"; return; }
      ar.value = POLICY_DRAFT.ar; fr.value = POLICY_DRAFT.fr; e.target.classList.remove("armed"); e.target.textContent = "إدراج مسودة لأكملها";
      ar.focus(); ar.setSelectionRange(ar.value.indexOf("["), ar.value.indexOf("]")+1);
      toast("أكمل ما بين المعقوفين [ ] أو احذف سطره، ثم اضغط «حفظ الإعدادات».");
    }
    if (e.target.id==="resetTexts"){ D.settings = {...gather(), texts:clone(FB.TEXTS)}; renderSite(); toast("أُرجعت النصوص الأصلية. اضغط «حفظ الإعدادات» لتطبيقها."); }
  };
  renderNotify();
  renderZr();
  $("#saveSite").onclick = async e=>{
    const s = gather();
    if (s.whatsapp && !/^213\d{9}$/.test(s.whatsapp)){ toast("رقم واتساب يجب أن يكون مثل 213555123456.", true); $("#s-wa").focus(); return; }
    if (s.categories.some(c=>!c.ar)){ toast("اكتب اسم كل قسم بالعربية.", true); return; }
 const blank = [s.policy.ar, s.policy.fr].join("\n").match(/\[[^\]\n]*\]/);
    if (blank){ toast(`في صفحة الاستبدال ما زال ${blank[0]} بلا قرار. أكمله أو احذف سطره.`, true); const el = s.policy.ar.includes(blank[0]) ? $("#s-pol-ar") : $("#s-pol-fr"); el.focus(); const i = el.value.indexOf(blank[0]); el.setSelectionRange(i, i+blank[0].length); return; }
    if (s.pixels.facebook && !/^\d{10,20}$/.test(s.pixels.facebook)){ toast("Meta Pixel ID أرقام فقط (عادةً 15 أو 16 رقماً).", true); $("#s-fbpx").focus(); return; }
    if (s.pixels.tiktok && !/^[A-Z0-9]{15,30}$/.test(s.pixels.tiktok)){ toast("TikTok Pixel ID حروف لاتينية وأرقام فقط (نحو 20 حرفاً).", true); $("#s-ttpx").focus(); return; }
    s.categories.forEach(c=>{ if(!c.fr) c.fr=c.ar; });
    if (await act(e.target, ()=>FB_API.saveSettings(s), "تم حفظ الإعدادات.")) D.settings = s;
  };
}

/* ---------- new-order notifications: Telegram (sent by the database) and this browser ---------- */
async function renderNotify(){
  const box = $("#notifyBox"); if (!box) return;
  let n; try { n = await FB_API.notifyGet(); } catch(e){
    box.innerHTML = `<legend>إشعار عند كل طلب جديد</legend><p class="small">إعدادات الإشعار غير موجودة في قاعدة البيانات بعد. شغّل <b>supabase/setup.sql</b> مرة أخرى (آمن، لا يحذف شيئاً)، ثم أعد تحميل الصفحة.</p>`; return; }
  const perm = "Notification" in window ? Notification.permission : "unsupported";
  box.innerHTML = `<legend>إشعار عند كل طلب جديد</legend>
    <h3 style="font-size:1rem">تيليغرام: رسالة على هاتفك فور وصول أي طلب</h3>
    ${n.demo?`<p class="small muted">في وضع التجربة لا تُرسل رسائل. تعمل بعد ربط Supabase.</p>`:!n.pg_net?`<p class="small err">الإضافة pg_net غير مفعّلة في Supabase: فعّلها من Database ← Extensions ← pg_net، ثم أعد تحميل الصفحة.</p>`:""}
    <ol class="small muted" style="margin:0;padding-inline-start:1.2rem;display:grid;gap:.25rem">
      <li>في تيليغرام افتح <b dir="ltr">@BotFather</b> وأرسل <b dir="ltr">/newbot</b>، واختر اسماً للبوت. سيعطيك <b>رمز البوت</b> (Token).</li>
      <li>افتح البوت الجديد واضغط <b dir="ltr">Start</b>، حتى يُسمح له بمراسلتك.</li>
      <li>افتح <b dir="ltr">@userinfobot</b> واضغط Start: سيعطيك <b>رقمك</b> (Id).</li>
      <li>الصق الرمز والرقم هنا، فعّل الإشعار، احفظ، ثم اضغط «رسالة تجربة».</li>
    </ol>
    <div class="grid2">
      <div class="field"><label for="n-token">رمز البوت (Token)</label><input id="n-token" type="password" dir="ltr" autocomplete="off" spellcheck="false" placeholder="${n.has_token?"محفوظ. اتركه فارغاً للإبقاء عليه":"123456789:AA..."}"></div>
      <div class="field"><label for="n-chat">رقمك في تيليغرام (Id)</label><input id="n-chat" dir="ltr" inputmode="numeric" value="${esc(n.chat||"")}" placeholder="123456789"></div>
    </div>
    <label class="check"><input type="checkbox" id="n-on" ${n.enabled?"checked":""}> إرسال رسالة عند كل طلب جديد</label>
    <p class="small muted">الرسالة فيها رقم الطلب والاسم والهاتف والولاية والقطع والمجموع. رمز البوت يُحفظ في قاعدة البيانات ولا يظهر في الموقع، ولا يُعرض هنا بعد حفظه.</p>
    <div class="toolbar"><button class="btn btn-primary btn-sm" type="button" id="n-save">حفظ إعدادات الإشعار</button><button class="btn btn-ghost btn-sm" type="button" id="n-test" ${n.demo||!n.pg_net?"disabled":""}>رسالة تجربة</button><span class="small" id="n-res" role="status"></span></div>
    <h3 style="font-size:1rem;margin-top:.6rem">هذا المتصفح: صوت وإشعار ما دامت اللوحة مفتوحة</h3>
    <div class="toolbar"><button class="btn btn-ghost btn-sm" type="button" id="n-browser" ${perm==="unsupported"||perm==="granted"?"disabled":""}>${perm==="granted"?"إشعار المتصفح مفعّل ✓":perm==="denied"?"إشعارات المتصفح مرفوضة: فعّلها من إعدادات المتصفح":perm==="unsupported"?"المتصفح لا يدعم الإشعارات":"تفعيل إشعار المتصفح"}</button>
      <button class="btn btn-ghost btn-sm" type="button" id="n-beep">تجربة الصوت</button></div>`;
  $("#n-save").onclick = async e=>{
    const token = $("#n-token").value.trim(), chat = $("#n-chat").value.trim(), on = $("#n-on").checked;
    if (token && !/^\d{5,15}:[A-Za-z0-9_-]{30,60}$/.test(token)){ toast("رمز البوت غير صحيح: انسخه كاملاً من BotFather (أرقام ثم : ثم حروف).", true); $("#n-token").focus(); return; }
    if (chat && !/^-?\d{3,20}$/.test(chat)){ toast("رقم تيليغرام أرقام فقط، كما يعطيك @userinfobot.", true); $("#n-chat").focus(); return; }
    if (on && (!chat || (!token && !n.has_token))){ toast("لتفعيل الإشعار أدخل رمز البوت ورقمك.", true); return; }
    if (await act(e.target, ()=>FB_API.notifySave(token, chat, on), "تم حفظ إعدادات الإشعار.")) renderNotify();
  };
  $("#n-test").onclick = async e=>{
    const res = $("#n-res"); e.target.disabled = true; res.textContent = "جارٍ الإرسال…";
    try {
      const id = await FB_API.notifyTest();
      if (id == null){ res.textContent = "احفظ رمز البوت ورقمك أولاً."; return; }
      let r = {pending:true};
      for (let i = 0; i < 8 && r.pending; i++){ await new Promise(ok=>setTimeout(ok, 1000)); r = await FB_API.notifyResult(id); }
      res.textContent = r.pending ? "أُرسلت، لكن لم يصل رد تيليغرام بعد. تحقّق من هاتفك."
        : r.status === 200 ? "✓ وصلت الرسالة. تحقّق من تيليغرام."
        : r.status === 401 || r.status === 404 ? "رمز البوت غير صحيح. انسخه من جديد من BotFather."
        : r.status === 400 || r.status === 403 ? "الرقم غير صحيح، أو لم تضغط Start في البوت بعد."
        : `لم تصل الرسالة (${r.status || r.error || "خطأ"}).`;
    } catch(err){ res.textContent = String(err?.message||err).includes("pg_net") ? "فعّل pg_net في Supabase أولاً." : errText(err); }
    finally { e.target.disabled = false; }
  };
  $("#n-browser").onclick = async ()=>{ try { await Notification.requestPermission(); } catch {} renderNotify(); };
  $("#n-beep").onclick = ()=>beep();
}

  });
  $("#zr-save").onclick = async e=>{
    const provider = box.querySelector('[name="zr-p"]:checked').value, key = $("#zr-key").value.trim(), tenant = $("#zr-tenant").value.trim(), on = $("#zr-on").checked;
    const changed = provider !== z.provider;
    if (key && !/^[A-Za-z0-9._~+/=-]{8,255}$/.test(key)){ toast("المفتاح غير صحيح: انسخه كاملاً كما يظهر في ZR، دون مسافات.", true); $("#zr-key").focus(); return; }
    if (tenant && provider === "zr" && !UUID_RE.test(tenant)){ toast("رقم الحساب (Tenant ID) يكون بهذا الشكل: xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.", true); $("#zr-tenant").focus(); return; }
    if (tenant && !/^[A-Za-z0-9._~+/=-]{4,255}$/.test(tenant)){ toast("الـ Token غير صحيح: انسخه كاملاً دون مسافات.", true); $("#zr-tenant").focus(); return; }
    if (on && ((!key && (!z.has_key || changed)) || (!tenant && (!z.has_tenant || changed)))){ toast(changed ? "عند تغيير المنصة أدخل المفتاحين من جديد." : "للتفعيل أدخل المفتاحين.", true); return; }
    if (await act(e.target, ()=>FB_API.courierSave(provider, key, tenant, on), "تم حفظ إعدادات ZR Express.")) renderZr();
  };
  $("#zr-test").onclick = async e=>{
    const res = $("#zr-res"); e.target.disabled = true; res.textContent = "جارٍ الاتصال بـ ZR…";
    try {
      const b = await FB_API.courierTest();
      res.textContent = old && b?.Statut && b.Statut !== "Accès activé" ? `ZR ردّت: ${b.Statut}` : "✓ ZR قبلت المفاتيح.";
    } catch(err){ res.textContent = errText(err); }
    finally { e.target.disabled = false; }
  };
}
// a short two-note chime (no sound file needed)
function beep(){
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), t = a.currentTime;
    [[880, 0], [1320, .18]].forEach(([f, d])=>{ const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; o.type = "sine";
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.25, t + d + .02); g.gain.exponentialRampToValueAtTime(.001, t + d + .45);
      o.connect(g).connect(a.destination); o.start(t + d); o.stop(t + d + .5); });
  } catch {}
}
// a new order while the dashboard is open: chime, toast, browser notification, title count, fresh list
let unseen = 0; const baseTitle = document.title;
function listenForOrders(){
  FB_API.onNewOrder(async o=>{
    beep(); unseen++; document.title = `(${unseen}) طلب جديد – ${baseTitle}`;
    toast(`طلب جديد ${o?.order_number || ""} من ${o?.first_name || ""} ${o?.last_name || ""}`.trim());
    try { if ("Notification" in window && Notification.permission === "granted" && document.hidden) new Notification("طلب جديد في Flame Boutique34", {body: `${o?.order_number || ""} · ${o?.first_name || ""} ${o?.last_name || ""} · ${o?.wilaya_name || ""}`, tag: "fb34-order"}); } catch {}
    try { await reload(); if (["overview","orders"].includes(tab) && !$("#editor").open) render(); } catch {}
  }).catch(()=>{});
  document.addEventListener("visibilitychange", ()=>{ if (!document.hidden){ unseen = 0; document.title = baseTitle; } });
}

/* ================= account ================= */
function renderAccount(){
  $("#main").innerHTML = `<section class="panel">
    <div class="panel-head"><h2>الحساب</h2></div>
    <form class="box" id="pwForm" style="display:grid;gap:.8rem;max-width:460px">
      <h3>تغيير كلمة المرور</h3>
      <div class="field"><label for="np1">كلمة المرور الجديدة (6 أحرف على الأقل)</label><input id="np1" type="password" autocomplete="new-password" minlength="6"></div>
      <div class="field"><label for="np2">أعد كتابتها</label><input id="np2" type="password" autocomplete="new-password"></div>
      <p class="err" id="pwErr" role="alert"></p>
      <button class="btn btn-primary" type="submit" style="justify-self:start">تغيير كلمة المرور</button>
    </form>
    ${FB_API.mode==="demo"?`<div class="box" style="display:grid;gap:.8rem;max-width:460px"><h3>بيانات التجربة</h3>
      <p class="muted">تمسح كل تعديلاتك في وضع التجربة وتعيد المنتجات والطلبات التجريبية.</p>
      <button class="btn btn-danger" type="button" id="resetDemo" style="justify-self:start">إعادة بيانات التجربة</button></div>`:""}
  </section>`;
  $("#pwForm").onsubmit = async e=>{
    e.preventDefault();
    const a=$("#np1").value, b=$("#np2").value;
    $("#pwErr").textContent = a.length<6 ? "كلمة المرور قصيرة. استعمل 6 أحرف على الأقل." : a!==b ? "الكلمتان غير متطابقتين." : "";
    if ($("#pwErr").textContent) return;
    if (await act(e.submitter, ()=>FB_API.changePassword(a), "تم تغيير كلمة المرور.")) e.target.reset();
  };
  $("#resetDemo")?.addEventListener("click", async e=>{
    const b=e.currentTarget;
    if (!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="اضغط مرة أخرى للتأكيد"; return; }
    await FB_API.resetDemo(); await reload(); toast("أُعيدت بيانات التجربة."); render();
  });
}

FB_API.hasSession().then(ok=>ok?start():($("#login").hidden=false, $("#pw").focus())).catch(()=>{ $("#login").hidden=false; });
