<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EADCC6">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<script>(function(){try{var th=JSON.parse(localStorage.getItem("fb34-theme")),lg=JSON.parse(localStorage.getItem("fb34-lang")),r=document.documentElement;if(th==="dark"||th==="light")r.dataset.theme=th;if(lg==="fr"){r.lang="fr";r.dir="ltr"}}catch(e){}})()</script>
<title>الدفع والتوصيل والاستبدال – Flame Boutique34</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Flame Boutique34: الدفع عند الاستلام، التوصيل إلى 69 ولاية، وشروط الاستبدال.">
<link rel="canonical" href="__SITE__/policy.html">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Flame Boutique34">
<meta property="og:locale" content="ar_AR">
<meta property="og:url" content="__SITE__/policy.html">
<meta property="og:title" content="الدفع والتوصيل والاستبدال — Flame Boutique34">
<meta property="og:description" content="الدفع عند الاستلام، التوصيل إلى 69 ولاية، وشروط الاستبدال في Flame Boutique34.">
<meta property="og:image" content="__SITE__/assets/intro-poster.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Marcellus&family=Noto+Naskh+Arabic:wght@400;600&family=Reem+Kufi:wght@500;600&display=swap">
<link rel="stylesheet" href="site.css">
<style>
main{min-height:60vh}
.policy{display:grid;gap:1.6rem;max-width:760px}
.policy h1{font-size:var(--step-3)}
.policy-body{display:grid;gap:.8rem;padding:clamp(1.2rem,3vw,2rem);border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.policy-body h2{font-size:var(--step-1);margin-top:.8rem}
.policy-body h2:first-child{margin-top:0}
.policy-body ul{margin:0;padding-inline-start:1.2rem;display:grid;gap:.4rem}
.policy-body li::marker{color:var(--ember)}
.policy-body p{color:var(--muted)}
.policy-ask{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1.2rem}
</style>
</head>
<body>
<main class="section">
  <div class="wrap policy">
    <h1 data-t="title"></h1>
    <article class="policy-body" id="body"><p class="muted" data-t="loading"></p></article>
    <div class="policy-ask"><span class="muted" data-t="ask"></span><a class="btn btn-ghost" id="wa" target="_blank" rel="noopener" hidden></a></div>
  </div>
</main>

<script src="assets/config.js"></script>
<script src="locations.js"></script>
<script src="shared.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
const T = {
 ar:{title:"الدفع والتوصيل والاستبدال",loading:"جارٍ التحميل…",ask:"سؤال لم تجدي جوابه هنا؟",wa:"راسلينا على واتساب"},
 fr:{title:"Paiement, livraison et échange",loading:"Chargement…",ask:"Une question sans réponse ici ?",wa:"Écrivez-nous sur WhatsApp"}
};
const UI = FBUI, $ = s=>document.querySelector(s), t = k=>T[UI.lang][k];
// live mode: the store page keeps the last catalog; show its settings at once, then refresh
const cached = FB_API.mode==="live" ? UI.store.get("fb34-catalog",null) : null;
let S = cached ? FB.mergeSettings(cached.settings) : null;
UI.chrome("policy");
function show(){
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  document.title = `${t("title")} – Flame Boutique34`;
  if (!S) return;
  // the owner's text in this language, else in the other one, else what the site already states
  const text = S.policy[UI.lang]?.trim() || S.policy[UI.lang==="ar"?"fr":"ar"]?.trim() || FB.policyFallback(S, UI.lang);
  $("#body").innerHTML = FB.policyHTML(text);
  const wa = UI.waUrl(S.whatsapp); $("#wa").hidden = !wa;
  if (wa){ $("#wa").href = wa; $("#wa").innerHTML = `${UI.icon("i-wa")}<span>${t("wa")}</span>`; }
}
$("#langBtn").onclick = ()=>{ UI.setLang(UI.lang==="ar"?"fr":"ar"); show(); };
show();
FB_API.loadCatalog().then(d=>{ S = d.settings; UI.setSocial(S); show(); })
  .catch(()=>{ S = FB.mergeSettings(null); UI.setSocial(S); show(); });
if ("requestIdleCallback" in window) requestIdleCallback(()=>UI.ripple()); else setTimeout(()=>UI.ripple(), 600);
</script>
</body>
</html>
