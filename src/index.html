/* ---------- film: the boutique video, moved forward by scrolling ----------
   The section is several screens tall; its video stays pinned on screen while the visitor scrolls through it,
   and the scroll position decides which moment of the video is shown. At its end the store follows. */
.film{position:relative;display:block;height:520vh;background:#19130D;cursor:pointer}
/* phones held upright: a longer scroll, so the upright video (200 pictures) passes slowly */
@media (orientation:portrait){.film{height:800vh}}
.film-pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
.film-pin canvas,.film-pin img{position:absolute;inset:0;width:100%;height:100%;display:block}
/* portrait screens: behind the whole picture, the same picture enlarged and blurred fills the screen (nothing on top of it) */
.film-pin .film-bg{inset:-8%;width:116%;height:116%;filter:blur(24px) brightness(.6) saturate(1.1);transform:translateZ(0)}
@media (orientation:landscape){.film-pin .film-bg{display:none}}
/* the picture shown matches the screen (upright video on an upright phone): it fills the screen, no blurred copy */
.film-pin.fill .film-bg{display:none}
/* social links and the shop location, right under the film */
.social-bar.under-film .wrap{justify-content:center!important;min-height:56px;padding-block:.4rem}
.social-bar.under-film .soc{width:42px;height:42px}
.social-bar.under-film .soc-map{width:auto;font-size:.9rem}
.film-pin img{object-fit:cover;object-position:center}
.film:focus-visible{outline:3px solid var(--ember);outline-offset:-3px}
/* fewer movements wanted: one still screen instead of the scrolling film */
html.calm .film{height:100vh;height:100svh}
/* bars, cart and WhatsApp stay out of the way while the film fills the screen, and slide in on the first scroll */
.topbar{position:fixed;inset:0 0 auto;z-index:30;transform:translateY(-105%);opacity:0;pointer-events:none;transition:transform .55s var(--ease),opacity .35s ease}
.topbar.show,.topbar:focus-within{transform:none;opacity:1;pointer-events:auto}
.topbar .site-header{position:static}
.fab{transition:opacity .35s ease,transform .35s var(--ease)}
html.at-film .fab{opacity:0;transform:scale(.7);pointer-events:none}
@media (prefers-reduced-motion:reduce){.topbar{transition:none}}

/* ---------- brand lines, shown in the store after the intro ---------- */
.brand-lines{padding-block:clamp(2rem,6vw,3.6rem) clamp(.6rem,2vw,1rem);text-align:center}
.brand-lines .wrap{display:grid;justify-items:center;gap:clamp(.7rem,2vw,1.1rem)}
.brand-name{margin:0;font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(1.25rem,5.2vw,3.1rem);letter-spacing:.24em;white-space:nowrap;line-height:1.15;color:var(--ink);direction:ltr;unicode-bidi:isolate;padding-inline-start:.24em}
.brand-rule{width:min(140px,30vw);height:1px;background:linear-gradient(90deg,transparent,var(--ember),transparent);border:0;margin:0}
.brand-quote{margin:0;font-family:"Noto Naskh Arabic","Amiri",serif;font-weight:600;font-size:clamp(1.3rem,3.6vw,2rem);line-height:2;color:var(--mulberry);direction:rtl;text-wrap:balance}
.brand-note{margin:0;font-family:"Noto Naskh Arabic",serif;font-size:clamp(1rem,2.4vw,1.2rem);line-height:2;color:var(--muted);direction:rtl;text-wrap:balance}
.brand-lines>.wrap>*{opacity:0}
.brand-lines.reveal>.wrap>*{opacity:1;animation:lift .9s var(--ease) both}
.brand-lines.reveal .brand-rule{animation-delay:.12s}.brand-lines.reveal .brand-quote{animation-delay:.24s}.brand-lines.reveal .brand-note{animation-delay:.38s}
@media (prefers-reduced-motion:reduce){.brand-lines>.wrap>*{opacity:1}.brand-lines.reveal>.wrap>*{animation:none}}
@media (max-width:520px){.brand-name{letter-spacing:.14em;padding-inline-start:.14em;font-size:clamp(1.15rem,6.4vw,1.7rem)}}

/* ---------- the rack: pieces hanging side-on on a brass rail; one turns to face you, and comes forward on a tap ----------
   Built like the shop's own racks: a lit wall niche (warm cove light on top, light falling on the wall, depth at its
   edges), a round brass rail fixed to the wall, each piece on a hanger hooked over the rail, close together and each at
   a slightly different angle, with its shadow on the wall. A piece that turns to face you sways a little. */
.rack{padding-block:clamp(1.4rem,4vw,2.6rem) clamp(1rem,3vw,2rem);
  --wall-a:#F1E6D4;--wall-b:#DECDB1;--glow:rgba(255,238,205,.75);--depth:rgba(70,45,20,.30);--cove:#F4D49A}
:root[data-theme="dark"] .rack{--wall-a:#2A2016;--wall-b:#1B140D;--glow:rgba(255,214,150,.20);--depth:rgba(0,0,0,.55);--cove:#C99A55}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rack{--wall-a:#2A2016;--wall-b:#1B140D;--glow:rgba(255,214,150,.20);--depth:rgba(0,0,0,.55);--cove:#C99A55}}
.rack+.rack{padding-top:0}
.rack .section-head{text-align:center;justify-items:center;margin-inline:auto}
/* the wall niche: it stays still while the rail inside it slides */
.rack-niche{position:relative;margin-inline:clamp(8px,3vw,40px);border-radius:16px;overflow:hidden;isolation:isolate;
  background:radial-gradient(70% 85% at 50% -8%,var(--glow),transparent 72%),linear-gradient(180deg,var(--wall-a),var(--wall-b));
  box-shadow:inset 0 30px 34px -26px var(--depth),inset 0 -26px 30px -24px var(--depth),inset 22px 0 30px -28px var(--depth),inset -22px 0 30px -28px var(--depth)}
/* the light strip hidden in the niche's top, as in the shop */
.rack-niche::before{content:"";position:absolute;inset:0 6% auto;height:3px;border-radius:0 0 3px 3px;z-index:3;pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--cove) 12%,#FFF4DA 50%,var(--cove) 88%,transparent);box-shadow:0 0 18px 4px var(--glow)}
/* the floor of the niche: a light marble ledge */
.rack-niche::after{content:"";position:absolute;inset:auto 0 0;height:18px;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 30%),linear-gradient(180deg,var(--wall-a),var(--wall-b));box-shadow:0 -8px 16px -10px var(--depth)}
/* the two wall mounts holding the rail */
.rack-mount{position:absolute;top:0;width:6px;height:52px;z-index:3;pointer-events:none;border-radius:0 0 3px 3px;
  background:linear-gradient(90deg,#6E4E27,#E9CF98 45%,#8C6634);box-shadow:4px 6px 8px -4px var(--depth)}
.rack-mount.l{left:calc(3% + 4px)}.rack-mount.r{right:calc(3% + 4px)}
.rack-rail{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.rack-rail::-webkit-scrollbar{display:none}
.rack-track{position:relative;display:flex;justify-content:center;min-width:max-content;margin-inline:auto;padding:44px 10vw 2.8rem;perspective:1100px}
/* the rail: a round brass rod, with its shadow on the wall below it */
.rack-track::before{content:"";position:absolute;top:44px;inset-inline:3%;height:10px;border-radius:6px;z-index:2;
  background:linear-gradient(180deg,#FFF1CF 0%,#E6C78C 18%,#B88C4E 50%,#8A6233 78%,#5E4220 100%);
  box-shadow:0 16px 10px -9px var(--depth),0 1px 1px rgba(0,0,0,.25)}
.hang{all:unset;box-sizing:border-box;position:relative;flex:none;width:var(--w,54px);height:clamp(320px,44vw,430px);cursor:pointer;scroll-snap-align:center;
  transition:width .55s var(--ease)}
/* .sw sways (pivoting on the hook), .turn turns the hanger and the piece together */
/* only the piece as seen catches the pointer: the boxes around it keep the unturned width and would cover the neighbours */
.hang .sw,.hang .turn,.hang .hook,.hang .bar{pointer-events:none}
.hang .sw{position:absolute;top:-14px;left:50%;height:calc(100% + 6px);transform-origin:50% 14px;transform:translateX(-50%) translateY(var(--dy,0px))}
.hang .turn{position:relative;display:flow-root;height:100%;transform-origin:50% 0;transform:rotateY(var(--turn,var(--tw,68deg)));
  transition:transform .65s var(--ease)}
.hang .hook{position:absolute;top:0;left:50%;width:22px;height:34px;transform:translateX(-50%);z-index:3;overflow:visible}
/* the hanger's shoulders sit inside the piece, as on a real hanger: only what the neckline leaves open shows */
.hang .bar{position:absolute;top:31px;left:19%;width:62%;height:11px;z-index:0;border-radius:50% 50% 0 0/100% 100% 0 0;
  border-top:4px solid #B98E51;box-shadow:inset 0 2px 0 -1px #F2DDAE,0 -1px 0 #7A5528}
.hang .g{position:relative;z-index:1;display:block;height:calc(100% - 36px);width:auto;max-width:none;margin-top:36px;
  filter:brightness(.82) saturate(.95) drop-shadow(14px 16px 12px rgba(50,30,10,.30));transition:filter .45s ease}
.hang:hover,.hang:focus-visible,.hang.face{--w:var(--wide,236px)}
.hang:hover .turn,.hang:focus-visible .turn,.hang.face .turn{--turn:0deg}
.hang:hover .g,.hang:focus-visible .g,.hang.face .g{filter:brightness(1.03) contrast(1.03) drop-shadow(16px 22px 16px rgba(50,30,10,.32))}
.hang:hover .sw,.hang:focus-visible .sw,.hang.face .sw{animation:sway 2.2s cubic-bezier(.3,.6,.4,1) both}
@keyframes sway{0%{rotate:0deg}18%{rotate:1.6deg}40%{rotate:-1.1deg}62%{rotate:.6deg}82%{rotate:-.25deg}100%{rotate:0deg}}
.hang:focus-visible{outline:2px solid var(--ember);outline-offset:4px;border-radius:8px}
.hang .cap{position:absolute;bottom:-1.9rem;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:.85rem;color:var(--muted);opacity:0;transition:opacity .3s}
.hang:hover .cap,.hang:focus-visible .cap,.hang.face .cap{opacity:1}
.rack-hint{text-align:center;color:var(--muted);font-size:.88rem;margin-top:2rem}
@media (prefers-reduced-motion:reduce){.hang,.hang .turn,.hang .g{transition:none}.hang .sw{animation:none!important}}
/* the piece brought forward: everything behind blurs */
.stage{width:min(820px,calc(100% - 24px));max-height:calc(100% - 24px);border:0;border-radius:20px;padding:0;background:transparent;overflow:visible}
.stage::backdrop{background:color-mix(in oklab,var(--linen) 55%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stage-in{position:relative;display:grid;grid-template-columns:1.15fr .85fr;gap:1rem 2rem;align-items:center;padding:clamp(1rem,3vw,2rem)}
.stage-fig{position:relative;height:min(64vh,520px);display:grid;place-items:center}
.stage-fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 22px 26px rgba(40,25,10,.3))}
.stage-fig img.next{clip-path:inset(0 0 100% 0)}
.stage-fig img.next.wipe{animation:wipe .75s var(--ease) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.stage-fig.arrive{animation:forward .6s var(--ease)}   /* once, when brought forward */
.stage-fig.flip{animation:flip .55s var(--ease)}
@keyframes flip{50%{transform:scaleX(.04)}}
@keyframes forward{from{opacity:0;transform:translateY(18px) scale(.86)}}
.stage-info{display:grid;gap:.9rem;align-content:center}
.stage-info h3{font-size:var(--step-2)}
.stage-info .price{font-size:var(--step-1);color:var(--mulberry)}
/* colours as hang tags on strings */
.tags{display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:flex-start}
.tag{all:unset;cursor:pointer;display:grid;justify-items:center;gap:0;transition:transform .3s var(--ease)}
.tag::before{content:"";width:1px;height:18px;background:color-mix(in oklab,var(--ink) 45%,transparent)}
.tag i{width:28px;height:44px;border-radius:4px 4px 6px 6px;background:var(--c);border:1px solid color-mix(in oklab,var(--ink) 18%,transparent);
  position:relative;box-shadow:0 4px 8px -4px rgba(40,25,10,.4)}
.tag i::after{content:"";position:absolute;top:5px;left:50%;width:5px;height:5px;border-radius:50%;transform:translateX(-50%);background:var(--surface)}
.tag small{font-size:.74rem;color:var(--muted);margin-top:.25rem}
.tag[aria-pressed="true"]{transform:translateY(4px)}
.tag[aria-pressed="true"] small{color:var(--ink);font-weight:600}
.tag:focus-visible i{outline:2px solid var(--ember);outline-offset:2px}
.fb-seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface);justify-self:start}
.fb-seg button{all:unset;cursor:pointer;padding:.3rem .9rem;border-radius:999px;font-size:.82rem;letter-spacing:.06em}
.fb-seg button[aria-pressed="true"]{background:var(--ink);color:var(--linen)}
.stage .close-x{position:absolute;top:.5rem;inset-inline-end:.5rem;z-index:3}
@media (max-width:700px){
  .stage{width:100%;max-height:100%;height:100%;margin:0;border-radius:0}
  .stage-in{grid-template-columns:1fr;padding-top:3.4rem;align-content:start;min-height:100%}
  .stage-fig{height:min(52vh,440px)}
}

/* ---------- welcome block ---------- */
.intro{padding-block:clamp(1.8rem,4vw,3rem) 0}
.intro-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem clamp(1rem,4vw,4rem);align-items:center}
.intro h1{font-size:var(--step-4)}
.hero-copy{display:grid;gap:1.1rem;min-width:0}
.hero-actions{display:flex;flex-wrap:wrap;gap:.75rem}
.promises{display:flex;flex-wrap:wrap;gap:.5rem 1.6rem;padding:0;margin:0;list-style:none;font-size:.95rem}
.promises li{display:flex;align-items:center;gap:.5rem}
.promises svg{width:18px;height:18px;color:var(--ember);flex:none}
@media (max-width:820px){.intro-grid{grid-template-columns:1fr}}
.intro h1,.hero-actions,.promises{animation:lift .9s var(--ease) both}
.hero-actions{animation-delay:.12s}.promises{animation-delay:.24s}
@keyframes lift{from{opacity:0;transform:translateY(14px)}}

/* ---------- shop ---------- */
.filters{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;margin-bottom:1.8rem;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:42px;padding:0 1.1rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap;font-size:.95rem;transition:background-color .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--linen);border-color:var(--ink)}
/* search and sort above the grid */
.shop-tools{display:flex;flex-wrap:wrap;align-items:center;gap:.7rem 1rem;margin:-.6rem 0 1.8rem}
.search-box{position:relative;flex:1 1 280px;max-width:440px}
.search-box svg{position:absolute;inset-inline-start:.95rem;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-box input{width:100%;min-height:44px;padding-inline:2.6rem 2.6rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.95rem}
.search-box input::-webkit-search-cancel-button{display:none}
.search-box input:focus{outline:none;border-color:var(--ember);box-shadow:0 0 0 3px color-mix(in oklab,var(--ember) 18%,transparent)}
.search-clear{position:absolute;inset-inline-end:.4rem;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:none;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.search-clear svg{position:static;transform:none;width:16px;height:16px}
.sort-box{display:flex;align-items:center;gap:.5rem;font-size:.9rem;color:var(--muted)}
.sort-box select{min-height:44px;padding:0 .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:.92rem;cursor:pointer}
.shop-count{font-size:.88rem;color:var(--muted);margin-inline-start:auto}
@media (max-width:560px){.search-box{flex-basis:100%;max-width:none}.shop-count{margin-inline-start:auto}}
.grid-none{grid-column:1/-1;display:grid;gap:.9rem;justify-items:start;padding-block:1.5rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:2.6rem 1.6rem}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem .8rem}}
.card{display:grid;gap:.55rem;min-width:0;align-content:start}
.card-media{all:unset;cursor:pointer;display:block;border-radius:0;transition:transform .5s var(--ease);will-change:transform;-webkit-tap-highlight-color:transparent}
.card-media:active{transform:scale(.985)}
.card-media:focus-visible{outline:2px solid var(--ember);outline-offset:4px}
.frame{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:0;overflow:hidden;display:grid;place-items:center;
  box-shadow:0 1px 2px rgba(40,25,10,.05);transition:box-shadow .5s var(--ease)}
.frame svg{width:78%;height:auto;transition:transform .6s var(--ease)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s var(--ease)}
@media (hover:hover){
  .card-media:hover{transform:translateY(-6px)}
  .card-media:hover .frame{box-shadow:0 24px 44px -20px rgba(40,25,10,.38)}
  .card-media:hover .frame img{transform:scale(1.05)}
  .card-media:hover .frame svg{transform:translateY(-6px) scale(1.03)}
}
/* photos appear softly once loaded (class "l" is set by ui.js), instead of popping in */
.frame img,.slide img{opacity:0;filter:blur(14px);transform:scale(1.04);transition:opacity .5s ease,filter .7s ease,transform .7s var(--ease)}
.frame img.l,.slide img.l{opacity:1;filter:none;transform:none}
/* desktop: the second photo shows on hover */
.frame img.alt{position:absolute;inset:0}
.frame img.alt.l{opacity:0}
@media (hover:hover){.card-media:hover .frame img.alt.l{opacity:1}}
/* flying thumbnail when a piece goes into the cart */
.fly{position:fixed;z-index:70;border-radius:0;overflow:hidden;display:grid;place-items:center;pointer-events:none;box-shadow:0 10px 30px -10px rgba(40,20,10,.5)}
.fly img{width:100%;height:100%;object-fit:cover}.fly svg{width:78%}
.badges{position:absolute;inset-block-end:.6rem;inset-inline:.6rem;display:flex;flex-wrap:wrap;gap:.3rem}
.badge{padding:.15rem .6rem;border-radius:999px;background:var(--surface);font-size:.76rem;color:var(--mulberry)}
.badge.sale{background:var(--mulberry);color:var(--on-mulberry)}
.card-name{font-family:var(--display);font-size:1.1rem;line-height:1.3}
.card-name button{all:unset;cursor:pointer}
.card-name button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.card-price{display:flex;flex-wrap:wrap;align-items:baseline;gap:.2rem .5rem}
.card-price b{font-weight:500;font-size:1.05rem}
.price-old{color:var(--muted);font-size:.88rem}
.card-opts{display:flex;flex-wrap:wrap;align-items:center;gap:.3rem .7rem;color:var(--muted);font-size:.84rem}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:1px solid color-mix(in oklab,var(--ink) 25%,transparent)}
.card-opts s{opacity:.6}
.stock{font-size:.82rem;display:flex;align-items:center;gap:.35rem}
.stock::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stock.ok{color:var(--success)}.stock.low{color:var(--ember)}.stock.out{color:var(--muted)}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:.45rem;margin-top:.2rem}
@media (max-width:560px){.card-actions{grid-template-columns:1fr}.card-actions .btn{min-height:40px;font-size:.84rem;padding:0 .5rem}}
.grid-msg{grid-column:1/-1;color:var(--muted);padding-block:2rem}
/* cards rise softly into place, one after another, as they come into view */
.card.rise{opacity:0;transform:translateY(24px) scale(.985)}
.card.rise.in{opacity:1;transform:none;transition:opacity .6s ease var(--d,0s),transform .75s var(--ease) var(--d,0s)}
@media (prefers-reduced-motion:reduce){
  .card.rise{opacity:1;transform:none}
  .card-media,.card-media:active,.card-media:hover,.card-media:hover .frame img,.frame,.frame img,.frame svg{transition:none;transform:none}
}
/* while the collection loads: grey shapes of cards with a light sweeping across, instead of a sentence */
.skel{display:grid;gap:.55rem}
.skel i{display:block;border-radius:6px;background:linear-gradient(100deg,color-mix(in oklab,var(--line) 70%,transparent) 30%,color-mix(in oklab,var(--surface) 85%,transparent) 50%,color-mix(in oklab,var(--line) 70%,transparent) 70%) 0 0/300% 100%;animation:sweep 1.4s linear infinite}
.skel .s-img{aspect-ratio:3/4;border-radius:0}
.skel .s-line{height:.95rem;width:70%}.skel .s-line.short{width:40%}
.skel .s-btn{height:2.3rem;border-radius:999px;margin-top:.3rem}
@keyframes sweep{from{background-position:100% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.skel i{animation:none}}

/* ---------- reviews ---------- */
.card-rate{display:flex;align-items:center;gap:.35rem;font-size:.82rem;color:var(--muted);margin-top:-.3rem}
.reviews-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1rem}
.rate-big{display:flex;align-items:center;gap:.7rem;font-size:1.15rem}
.rate-big b{font-family:var(--display);font-size:var(--step-3);font-weight:500;line-height:1}
.rev-row{display:grid;grid-auto-flow:column;grid-auto-columns:min(340px,82%);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.6rem;margin-top:1.6rem;scrollbar-width:thin}
.rev-row>.rev{scroll-snap-align:start}
.q-rate{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:.4rem;font-size:.9rem;color:var(--muted)}
.q-rate:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.q-reviews{display:grid;gap:.8rem;padding-top:1rem;border-top:1px solid var(--line)}
.q-reviews h3{font-size:1.05rem;font-family:var(--body);font-weight:600}
.q-reviews .rev{padding:.9rem 1rem}
/* related pieces in the product window */
.q-more{display:grid;gap:.8rem;padding-top:1rem;border-top:1px solid var(--line)}
.q-more h3{font-size:1.05rem;font-family:var(--body);font-weight:600}
.more-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem}
@media (max-width:520px){.more-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.more{all:unset;cursor:pointer;display:grid;gap:.3rem;min-width:0;font-size:.84rem}
.more .frame{border-radius:0}
.more:hover .frame img,.more:hover .frame svg{transform:scale(1.04)}
.more:focus-visible{outline:2px solid var(--ember);outline-offset:3px;border-radius:8px}
.more span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.policy-link{font-size:.86rem;color:var(--muted)}
.policy-link a{color:inherit;text-underline-offset:3px}

/* ---------- size tip and visit ---------- */
.story{background:var(--surface);border-block:1px solid var(--line)}
.section.story{padding-block:clamp(1.5rem,4vw,2.5rem)}
.story p{color:var(--muted);font-size:var(--step-1);max-width:60ch}
.visit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:2rem}
.visit-grid h3{font-size:var(--step-1);margin-bottom:.5rem}
.visit-grid p{color:var(--muted)}
.visit-grid .btn{margin-top:1rem}
.copy-row{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
#phoneTxt{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;font-size:1.1rem;text-decoration:none}
#visit{background:var(--linen)}
.map{margin-top:2rem;aspect-ratio:16/7;min-height:280px;max-width:100%;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.map iframe{display:block;width:100%;height:100%;border:0}
.grid-empty{grid-column:1/-1;display:grid;gap:1rem;justify-items:start;padding:2rem;border:1px dashed var(--line);border-radius:18px;background:var(--surface)}
.grid-empty .row-btns{display:flex;flex-wrap:wrap;gap:.6rem}

/* ---------- product window ---------- */
.quick{width:min(920px,calc(100% - 24px));max-height:calc(100% - 24px);border-radius:20px;opacity:0;transform:translateY(16px) scale(.98);transition:opacity .3s,transform .4s var(--ease)}
.quick.is-open{opacity:1;transform:none}
/* a tapped photo flies from the grid into the window (FLIP). While it flies, the window carries no transform
   (so the fixed ghost keeps viewport coordinates) and its own gallery is hidden until the ghost lands. */
.quick.zooming{transform:none!important;opacity:1!important;transition:none}
.quick.zooming #qGal{opacity:0}
.zoom-ghost{position:fixed;z-index:50;overflow:hidden;display:grid;place-items:center;pointer-events:none;will-change:transform}
.zoom-ghost img{width:100%;height:100%;object-fit:cover;display:block}
.zoom-ghost svg{width:78%;height:auto}
@media (prefers-reduced-motion:reduce){.quick.zooming{transition:none}}
.quick-grid{display:grid;grid-template-columns:1fr 1.1fr}
.gal{position:relative;border-radius:0;overflow:hidden;min-height:360px;height:100%}
.gal-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;overscroll-behavior-x:contain;transition:opacity .22s ease}
.gal-track::-webkit-scrollbar{display:none}
.gal-track.fade{opacity:0}
.slide{all:unset;flex:0 0 100%;height:100%;scroll-snap-align:center;display:grid;place-items:center;overflow:hidden;box-sizing:border-box}
button.slide{cursor:zoom-in}
.slide img{width:100%;height:100%;object-fit:cover}
.slide svg{width:78%;height:auto}
.slide:focus-visible{outline:2px solid var(--ember);outline-offset:-4px}
.gal-dots{position:absolute;inset-inline:0;bottom:.8rem;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gal-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,253,249,.6);box-shadow:0 0 0 1px rgba(40,20,10,.15);transition:width .25s,background-color .25s}
.gal-dots i.on{width:18px;border-radius:4px;background:#FFFDF9}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,253,249,.85);color:#3B2A26;cursor:pointer;display:none;place-items:center;font-size:1.2rem}
.gal-nav.prev{inset-inline-start:.6rem}.gal-nav.next{inset-inline-end:.6rem}
@media (hover:hover){.gal.multi .gal-nav{display:grid}}
/* full-screen photo: pinch or double-tap to zoom, drag to look around */
.zoom{width:100%;height:100%;max-width:100%;max-height:100%;margin:0;background:#120D0C;color:#FBF6F0;padding:0}
.zoom:not([open]){display:none}
.zoom-stage{position:absolute;inset:0;overflow:hidden;touch-action:none;display:grid;place-items:center;cursor:zoom-in}
.zoom-stage.zoomed{cursor:grab}
.zoom-stage img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-drag:none}
.zoom .close-x{inset-block-start:calc(12px + env(safe-area-inset-top,0px))}
.zoom-hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));inset-inline:0;text-align:center;font-size:.85rem;opacity:.7;pointer-events:none}
.zoom-count{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));inset-inline-start:20px;font-size:.9rem;opacity:.8;font-variant-numeric:tabular-nums}
.zoom .gal-nav{display:grid;background:rgba(255,253,249,.15);color:#FBF6F0}
.zoom .close-x{background:rgba(255,253,249,.15);border-color:rgba(255,253,249,.3);color:#FBF6F0}
/* the ‹ › characters are mirrored by the browser in Arabic, so "previous" (on the right) points right */
.gal-nav span{display:inline-block;line-height:1}
.quick-body{padding:clamp(1.25rem,3vw,2.2rem);display:grid;gap:1rem;align-content:start;min-width:0}
.quick-body h2{font-size:var(--step-2)}
.quick-price{font-size:var(--step-1);color:var(--mulberry);display:flex;flex-wrap:wrap;gap:.2rem .6rem;align-items:baseline}
.quick-desc{color:var(--muted)}
.swatch span{gap:.5rem;grid-auto-flow:column}
.swatch i{width:18px;height:18px;border-radius:50%;border:1px solid color-mix(in oklab,var(--ink) 25%,transparent)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qty button{width:40px;height:40px;border:0;background:none;cursor:pointer;font-size:1.1rem}
.qty button[disabled]{opacity:.35;cursor:not-allowed}
.qty output{min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
details{font-size:.92rem;color:var(--muted)}
summary{cursor:pointer;color:var(--ink)}
.size-table{width:100%;border-collapse:collapse;margin-top:.6rem;font-variant-numeric:tabular-nums}
.size-table th,.size-table td{border-bottom:1px solid var(--line);padding:.35rem;text-align:start}
.table-scroll{overflow-x:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.buy-row{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:700px){
  .quick{width:100%;max-height:94%;margin:auto auto 0;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(40px)}
  .quick-grid{grid-template-columns:1fr}
  .gal{min-height:0;height:auto;aspect-ratio:4/4.4;border-radius:0}
  .slide svg{width:auto;height:88%}
}

/* ---------- cart drawer: slides in from the reading-end side ---------- */
.drawer{--off:100%;position:fixed;inset-block:0;inset-inline-end:0;inset-inline-start:auto;margin:0;height:100%;width:min(460px,100%);display:flex;flex-direction:column;transform:translateX(var(--off));transition:transform .45s var(--ease);padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
[dir="rtl"] .drawer{--off:-100%}
.drawer:not([open]){display:none}
.drawer.is-open{transform:none}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:var(--step-1)}
.panel-body{flex:1;overflow-y:auto;padding:1.25rem;display:grid;gap:1.1rem;align-content:start}
.panel-foot{padding:1rem 1.25rem;border-top:1px solid var(--line);display:grid;gap:.6rem;background:var(--surface)}
.line{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:.8rem;align-items:start;padding-bottom:1rem;border-bottom:1px solid var(--line)}
.line .frame{border-radius:0;width:64px}
.line-info{min-width:0;display:grid;gap:.4rem}
.line-info strong{font-weight:500;font-family:var(--display)}
.line-sel{display:flex;flex-wrap:wrap;gap:.4rem}
.line-sel select{min-height:36px;padding:0 .5rem;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:.85rem;max-width:100%}
.line .qty button{width:32px;height:32px}
.line-end{display:grid;justify-items:end;gap:.2rem;text-align:end}
.line-end small{color:var(--muted);font-size:.8rem}
.sum{display:grid;gap:.35rem}
.sum .row{font-size:.95rem}
.sum .total{font-size:var(--step-1);font-weight:500;padding-top:.3rem;border-top:1px solid var(--line)}
.note-pending{font-size:.85rem;color:var(--ember)}

/* ---------- checkout window ---------- */
.co{width:min(700px,calc(100% - 24px));max-height:calc(100% - 24px);border-radius:20px;display:flex;flex-direction:column;opacity:0;transform:translateY(16px);transition:opacity .3s,transform .4s var(--ease)}
.co:not([open]){display:none}
.co.is-open{opacity:1;transform:none}
@media (max-width:640px){.co{width:100%;height:100%;max-height:100%;border-radius:0;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}}
.co-items{display:grid;gap:.4rem;padding:.8rem 1rem;border-radius:12px;background:var(--linen);font-size:.9rem}
.co-items .row span:first-child{min-width:0}
.co-form{display:grid;gap:1rem}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.co h3{font-size:1.05rem;font-family:var(--body);font-weight:600}
.box-err{padding:.8rem 1rem;border-radius:12px;background:color-mix(in oklab,var(--danger) 10%,var(--surface));color:var(--danger);display:grid;gap:.6rem;justify-items:start}
.review{display:grid;gap:1.2rem}
.review section{display:grid;gap:.4rem}
.review dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.25rem 1rem;font-size:.95rem}
.review dt{color:var(--muted)}
.review dd{margin:0;min-width:0;overflow-wrap:anywhere}
.done{display:grid;gap:1rem;justify-items:center;text-align:center;padding-block:1rem}
.done h2{font-size:var(--step-2)}
.done .ids{display:grid;gap:.6rem;width:100%;text-align:start}
.done-actions{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;width:100%}
@media (max-width:480px){.done-actions,.buy-row{grid-template-columns:1fr}}
/* size guide */
.sg-legend{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem}
.sg-link{font:inherit;font-size:.82rem;color:var(--mulberry);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.sg-link:hover{color:var(--ember)}
.sizeguide{border:0;border-radius:18px;padding:clamp(1.1rem,3vw,1.6rem);max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 60px rgba(40,25,10,.35)}
.sizeguide::backdrop{background:color-mix(in oklab,var(--linen) 55%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.sizeguide h2{margin:0 2rem .4rem 0;font-size:var(--step-1)}
.sg-intro{margin:.2rem 0 1rem;font-size:.92rem;line-height:1.7}
.sg-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
.sg-table{width:100%;border-collapse:collapse;font-size:.92rem;min-width:360px}
.sg-table th,.sg-table td{padding:.6rem .5rem;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.sg-table tr:last-child th,.sg-table tr:last-child td{border-bottom:0}
.sg-table thead th{background:color-mix(in oklab,var(--ember) 16%,var(--surface));font-weight:600}
.sg-table tbody th{font-weight:700}
.sg-table tbody tr:nth-child(even){background:color-mix(in oklab,var(--ember) 7%,transparent)}
.sg-note{margin:1rem 0 0;line-height:1.7}
</style>
</head>
<body>
<main id="top">
  <!-- the boutique video, alone on screen, moved forward by scrolling (no sound, no controls, nothing on top).
       It is drawn from a sequence of pictures (tools/make_film.sh), which behaves the same on every device:
       the upright video on upright screens (phones), the wide video on wide screens (computers).
       At its end the store follows. A tap glides to the store. -->
  <a class="film" id="film" href="#brandLines" aria-label="Flame Boutique34">
    <div class="film-pin">
      <img class="film-bg" src="assets/intro-poster.jpg" alt="" aria-hidden="true" width="1280" height="720">
      <canvas class="film-bg" id="filmBg" aria-hidden="true"></canvas>
      <picture><source media="(orientation: portrait)" srcset="assets/intro-poster-p.jpg"><img class="film-poster" src="assets/intro-poster.jpg" alt="" aria-hidden="true" fetchpriority="high" width="1280" height="720"></picture>
      <canvas id="filmCanvas" aria-hidden="true"></canvas>
    </div>
  </a>

  <section class="brand-lines" id="brandLines" aria-label="FLAME BOUTIQUE 34">
    <div class="wrap">
      <p class="brand-name" lang="en">FLAME BOUTIQUE 34</p>
      <hr class="brand-rule">
      <p class="brand-quote" lang="ar" dir="rtl">حَقٌّ لِلْجَمَالِ عَلَيْكِ أَنْ يَزْهُو</p>
      <p class="brand-note" lang="ar" dir="rtl">لا نحتاجُ إلى إشهارٍ، زبائنُنا يقومون بذلك</p>
    </div>
  </section>

  <div id="racks"></div>

  <section class="intro">
    <div class="wrap intro-grid">
      <h1 data-i18n="heroA"></h1>
      <div class="hero-copy">
        <div class="hero-actions">
          <a class="btn btn-primary" href="#shop" data-i18n="heroCta"></a>
          <a class="btn btn-ghost" href="track.html" data-i18n="trackCta"></a>
        </div>
        <ul class="promises">
          <li><svg aria-hidden="true"><use href="#i-cash"/></svg><span data-i18n="pCod"></span></li>
          <li><svg aria-hidden="true"><use href="#i-truck"/></svg><span data-i18n="pShip"></span></li>
          <li><svg aria-hidden="true"><use href="#i-swap"/></svg><span data-i18n="pSwap"></span></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="section" id="shop">
    <div class="wrap">
      <div class="section-head">
        <h2 data-i18n="shopTitle"></h2>
        <p data-i18n="shopSub"></p>
      </div>
      <div class="filters" id="filters" role="group"></div>
      <div class="shop-tools" id="shopTools" hidden>
        <div class="search-box" role="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false">
          <button class="search-clear" type="button" id="qClear" hidden><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="clearSearch"></span></button>
        </div>
        <label class="sort-box"><span data-i18n="sortBy"></span><select id="sort"></select></label>
        <span class="shop-count" id="shopCount" aria-live="polite"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <section class="section" id="reviews" hidden>
    <div class="wrap">
      <div class="reviews-head">
        <div class="section-head" style="margin:0"><h2 data-i18n="revTitle"></h2><p data-i18n="revSub"></p></div>
        <div class="rate-big" id="revAvg"></div>
      </div>
      <div class="rev-row" id="revRow"></div>
    </div>
  </section>

  <section class="section story" id="story">
    <div class="wrap"><p data-i18n="story2"></p></div>
  </section>

  <section class="section" id="visit">
    <div class="wrap">
      <div class="section-head"><h2 data-i18n="visitTitle"></h2></div>
      <div class="visit-grid">
        <div>
          <h3 data-i18n="addrTitle"></h3>
          <p id="addr"></p>
          <a class="btn btn-ghost" id="mapLink" target="_blank" rel="noopener" data-i18n="openMap"></a>
        </div>
        <div id="hoursBox">
          <h3 data-i18n="hoursTitle"></h3>
          <p id="hours"></p>
        </div>
        <div id="phoneBox">
          <h3 data-i18n="contactTitle"></h3>
          <div class="copy-row"><a id="phoneTxt" class="ltr"></a><button class="link-btn" type="button" id="copyPhone" data-i18n="copy"></button></div>
          <a class="btn btn-ghost" id="waLink" target="_blank" rel="noopener" style="margin-top:1rem"><svg aria-hidden="true"><use href="#i-wa"/></svg><span data-i18n="waChat"></span></a>
        </div>
      </div>
      <div class="map" id="mapBox" hidden></div>
    </div>
  </section>
</main>

<!-- product window: choose color, size and quantity, then order now or add to the cart -->
<dialog class="quick" id="quick" aria-labelledby="qName">
  <button class="icon-btn close-x" type="button" data-close><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="close"></span></button>
  <form class="quick-grid" id="quickForm" novalidate>
    <div class="gal" id="qGal">
      <div class="gal-track" id="qTrack"></div>
      <button class="gal-nav prev" type="button" data-i18n-label="prevPhoto"><span>‹</span></button>
      <button class="gal-nav next" type="button" data-i18n-label="nextPhoto"><span>›</span></button>
      <div class="gal-dots" id="qDots" aria-hidden="true"></div>
    </div>
    <div class="quick-body">
      <div>
        <h2 id="qName"></h2>
        <p class="quick-price price" id="qPrice"></p>
        <button class="q-rate" type="button" id="qRate" hidden></button>
      </div>
      <p class="quick-desc" id="qDesc"></p>
      <p class="stock" id="qStock"></p>
      <fieldset><legend data-i18n="color"></legend><div class="opts" id="qColors"></div></fieldset>
      <fieldset><legend class="sg-legend"><span data-i18n="size"></span><button type="button" class="sg-link" id="qSizeGuide" hidden data-i18n="sizeGuide"></button></legend><div class="opts" id="qSizes"></div><p class="err" id="qErr" role="alert"></p><p class="hint" id="qLeft" aria-live="polite"></p></fieldset>
      <div class="row">
        <span data-i18n="qty"></span>
        <div class="qty"><button type="button" id="qMinus" data-i18n-label="less">−</button><output id="qQty">1</output><button type="button" id="qPlus" data-i18n-label="more">+</button></div>
      </div>
      <div class="buy-row">
        <button class="btn btn-primary" type="button" id="qBuy" data-i18n="buyNow"></button>
        <button class="btn btn-ghost" type="button" id="qAdd" data-i18n="addToCart"></button>
      </div>
      <p class="policy-link"><a href="policy.html" data-i18n="policyLink"></a></p>
      <section class="q-reviews" id="qReviews" hidden></section>
      <section class="q-more" id="qMore" hidden></section>
    </div>
  </form>
</dialog>

<!-- size guide, edited by the owner from the dashboard -->
<dialog class="sizeguide" id="sizeGuide" aria-labelledby="sgTitle">
  <button class="icon-btn close-x" type="button" data-close><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="close"></span></button>
  <h2 id="sgTitle" data-i18n="sizeGuide"></h2>
  <p class="sg-intro muted" id="sgIntro"></p>
  <div class="sg-scroll"><table class="sg-table" id="sgTable"></table></div>
  <p class="sg-note hint" id="sgNote"></p>
</dialog>

<!-- a piece from the rack, brought forward -->
<dialog class="stage" id="stage" aria-labelledby="stName">
  <div class="stage-in">
    <button class="icon-btn close-x" type="button" data-close><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="close"></span></button>
    <div class="stage-fig" id="stFig"><img class="cur" id="stCur" alt=""><img class="next" id="stNext" alt="" aria-hidden="true"></div>
    <div class="stage-info">
      <h3 id="stName"></h3>
      <p class="price" id="stPrice"></p>
      <div class="tags" id="stTags" role="group"></div>
      <div class="fb-seg" id="stSide" role="group" hidden><button type="button" data-side="front" aria-pressed="true" data-i18n="front"></button><button type="button" data-side="back" aria-pressed="false" data-i18n="back"></button></div>
      <div class="buy-row"><button class="btn btn-primary" type="button" id="stBuy" data-i18n="buyNow"></button><button class="btn btn-ghost" type="button" id="stAdd" data-i18n="addToCart"></button></div>
    </div>
  </div>
</dialog>

<!-- full-screen photo -->
<dialog class="zoom" id="zoom" aria-labelledby="zoomCount">
  <div class="zoom-stage" id="zoomStage"><img id="zoomImg" alt=""></div>
  <span class="zoom-count" id="zoomCount"></span>
  <button class="gal-nav prev" type="button" id="zoomPrev" data-i18n-label="prevPhoto"><span>‹</span></button>
  <button class="gal-nav next" type="button" id="zoomNext" data-i18n-label="nextPhoto"><span>›</span></button>
  <button class="icon-btn close-x" type="button" id="zoomClose"><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="close"></span></button>
  <p class="zoom-hint" data-i18n="zoomHint"></p>
</dialog>

<!-- cart -->
<dialog class="drawer" id="drawer" aria-labelledby="dTitle">
  <div class="panel-head"><h2 id="dTitle" data-i18n="cartTitle"></h2><button class="icon-btn" type="button" data-close><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="close"></span></button></div>
  <div class="panel-body" id="dBody"></div>
  <div class="panel-foot" id="dFoot"></div>
</dialog>

<!-- checkout: form -> review -> confirmed. Used for "order now" (one product) and for the whole cart. -->
<dialog class="co" id="checkout" aria-labelledby="coTitle">
  <div class="panel-head"><h2 id="coTitle"></h2><button class="icon-btn" type="button" id="coClose"><svg aria-hidden="true"><use href="#i-x"/></svg><span class="sr" data-i18n="close"></span></button></div>
  <div class="panel-body" id="coBody"></div>
  <div class="panel-foot" id="coFoot"></div>
</dialog>

const UI = FBUI, $ = s=>document.querySelector(s), esc = FB.esc, store = UI.store;
const t = k=>T[UI.lang][k];
let S = FB.mergeSettings(null), PRODUCTS = [], RATES = {}, REVIEWS = [], loaded = false, loadFailed = false;
const cached = FB_API.mode==="live" ? store.get("fb34-catalog",null) : null;  // live mode: show the last catalog at once, then refresh
if (cached){ S = FB.mergeSettings(cached.settings); PRODUCTS = cached.products; RATES = cached.rates||{}; REVIEWS = cached.reviews||[]; loaded = true; FB_PIXELS.init(S); }
let cart = store.get("fb34-cart",[]);
let filter = "all", query = "", sortBy = "featured";
const txt = k=>S.texts[k]?.[UI.lang] || FB.TEXTS[k]?.[UI.lang] || T[UI.lang][k] || "";
const fmt = n=>FB.money(n,t("cur"));
const byId = id=>PRODUCTS.find(p=>p.id===id);
const sizeLabel = s=>s==="TU"?t("oneSize"):s;
const nm = o=>o?.[UI.lang] || o?.ar || "";
const sale = p=>p.compare_price>p.price ? Math.round((1-p.price/p.compare_price)*100) : 0;
const priceHTML = p=>`<b class="price">${fmt(p.price)}</b>${sale(p)?`<s class="price price-old">${fmt(p.compare_price)}</s>`:""}`;
function stockState(p){
  if (FB.soldOut(p)) return ["out",t("soldOut")];
  if (p.stock && p.sizes.some(s=>{const n=FB.stockOf(p,s); return n!=null&&n>0&&n<=3;})) return ["low",t("low")];
  return ["ok",t("inStock")];
}

UI.chrome("store");

/* ---------- shop ---------- */
function renderFilters(){
  const cats = [{id:"all",ar:T.ar.all,fr:T.fr.all},...S.categories];
  if (!cats.some(c=>c.id===filter)) filter="all";
  $("#filters").innerHTML = cats.map(c=>`<button class="chip" type="button" data-cat="${esc(c.id)}" aria-pressed="${c.id===filter}">${esc(nm(c))}</button>`).join("");
}
// search ignores case, accents, Arabic diacritics and letter variants; every word typed must match
function haystack(p){
  const cat = S.categories.find(c=>c.id===p.category);
  return FB.fold([p.name?.ar, p.name?.fr, p.description?.ar, p.description?.fr, cat?.ar, cat?.fr,
    ...p.colors.flatMap(c=>[c.ar, c.fr]), p.badge && T.ar[p.badge], p.badge && T.fr[p.badge]].filter(Boolean).join(" "));
}
const SORTS = {
  featured: (a,b)=>a.sort-b.sort,
  new: (a,b)=>String(b.created_at||"").localeCompare(String(a.created_at||"")) || a.sort-b.sort,
  priceUp: (a,b)=>a.price-b.price,
  priceDown: (a,b)=>b.price-a.price,
  rated: (a,b)=>{ const x=FB.ratingOf(REVIEWS,a.id), y=FB.ratingOf(REVIEWS,b.id); return y.avg-x.avg || y.n-x.n || a.sort-b.sort; },
  sale: (a,b)=>sale(b)-sale(a) || a.sort-b.sort
};
// the forms a typed word may take in the product texts: سوداء/أسود, عبايات/عباية, القفطان/قفطان, noire/noir, robes/robe
function forms(w){
  const f = new Set([w]);
  const bare = w.replace(/^(وال|بال|لل|ال)(?=..)/, "");
  f.add(bare);
  if (/^...اء$/.test(bare)) f.add("ا" + bare.slice(0,3));          // فعلاء -> أفعل (colours)

  // cards arriving within a moment of each other (in one or several batches) share one cascade

let faceTick = false;
function faceMiddle(){
  faceTick = false;
  document.querySelectorAll("#racks .rack-rail").forEach(rail=>{
    const items = [...rail.querySelectorAll(".hang")];
    if (rail.scrollWidth <= rail.clientWidth + 4){ items.forEach(h=>h.classList.remove("face")); return; }

}

// Apple-style zoom: clone the clicked photo and glide it from the grid into the window's gallery.
// Falls back to a plain open when motion is reduced, the window is already open, or layout isn't ready.
async function zoomToQuick(srcFrame, id){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce || !srcFrame || $("#quick").open){ openProduct(id); return; }
  let from; try { from = srcFrame.getBoundingClientRect(); } catch { openProduct(id); return; }
  const dlg = $("#quick");
  dlg.classList.add("zooming");
  openProduct(id);
  const gal = $("#qGal");
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  const to = gal.getBoundingClientRect();
  const cleanup = () => dlg.classList.remove("zooming");
  if (!to.width || !to.height || !from.width){ cleanup(); return; }   // nothing to animate from/to
  const ghost = document.createElement("div");
  ghost.className = "zoom-ghost";
  ghost.setAttribute("style", `left:0;top:0;width:${to.width}px;height:${to.height}px;transform-origin:top left;${gal.getAttribute("style")||""}`);
  const slide = $("#qTrack").querySelector(".slide");
  ghost.innerHTML = (slide && slide.innerHTML) || srcFrame.innerHTML;
  ghost.querySelector("img")?.classList.add("l");
  const sx = from.width / to.width, sy = from.height / to.height;
  ghost.style.transform = `translate(${from.left}px,${from.top}px) scale(${sx},${sy})`;
  dlg.append(ghost);
  requestAnimationFrame(() => {
    ghost.style.transition = "transform .44s var(--ease)";
    ghost.style.transform = `translate(${to.left}px,${to.top}px) scale(1,1)`;
  });
  let done = false;
  const finish = () => { if (done) return; done = true; cleanup(); ghost.remove(); };
  ghost.addEventListener("transitionend", finish, {once:true});
  setTimeout(finish, 560);
}

    track.innerHTML = gal.length
      ? gal.map((u,i)=>`<button class="slide" type="button" data-z="${i}" aria-label="${t("zoomPhoto")}: ${t("photoN")(i+1,gal.length)}"><img src="${esc(u)}" alt="${esc(nm(current.name))}" decoding="async" ${i?'loading="lazy"':""}></button>`).join("")
      : `<div class="slide">${FB.garment(current, current.colors[ci]?.hex || "#8a7a80")}</div>`;
    track.scrollLeft = 0;
    $("#qDots").innerHTML = gal.length > 1 ? gal.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("") : "";
    galObs?.disconnect();
    if (gal.length > 1 && "IntersectionObserver" in window){
      galObs = new IntersectionObserver(es=>es.forEach(e=>{ if (e.isIntersecting){ galIdx = +e.target.dataset.z; [...$("#qDots").children].forEach((d,i)=>d.classList.toggle("on", i===galIdx)); } }), {root:track, threshold:.6});
      track.querySelectorAll(".slide").forEach(s=>galObs.observe(s));
    }
    track.classList.remove("fade");
  };
  // a color change cross-fades the photos instead of swapping them abruptly
  if (smooth && !matchMedia("(prefers-reduced-motion: reduce)").matches){ $("#qTrack").classList.add("fade"); setTimeout(draw, 200); }
  else draw();
}
function galGo(i){

  const n = Math.max(0, Math.min(slides.length-1, i));

}

/* ---------- full-screen photo with pinch, double-tap and drag ---------- */
const Z = {i:0, s:1, x:0, y:0, pts:new Map(), pinch:null, lastTap:0, moved:false};
function openZoom(i){
  if (!gal.length) return;
  Z.i = i; showZoom();
  UI.openDialog($("#zoom"));
}
function showZoom(){
  Z.s = 1; Z.x = 0; Z.y = 0; applyZoom();
  const img = $("#zoomImg"); img.src = gal[Z.i]; img.alt = nm(current.name);
  $("#zoomCount").textContent = gal.length > 1 ? t("photoN")(Z.i+1, gal.length) : "";
  $("#zoomPrev").hidden = $("#zoomNext").hidden = gal.length < 2;
}
function applyZoom(){
  const img = $("#zoomImg"), w = img.clientWidth, h = img.clientHeight;
  // keep the photo covering its frame: it can't be dragged past its edges
  const mx = (Z.s - 1) * w, my = (Z.s - 1) * h;
  Z.x = Math.min(0, Math.max(-mx, Z.x)); Z.y = Math.min(0, Math.max(-my, Z.y));
  img.style.transform = `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  $("#zoomStage").classList.toggle("zoomed", Z.s > 1.01);
}
function zoomAt(cx, cy, s){
  const r = $("#zoomImg").getBoundingClientRect(), base = r.left - Z.x, top = r.top - Z.y;
  const px = (cx - r.left) / Z.s, py = (cy - r.top) / Z.s;   // point under the finger, in image pixels
  Z.s = Math.max(1, Math.min(4, s));
  Z.x = cx - base - px * Z.s; Z.y = cy - top - py * Z.s;
  applyZoom();
}
const stage = $("#zoomStage");
stage.addEventListener("pointerdown", e=>{
  stage.setPointerCapture(e.pointerId); Z.pts.set(e.pointerId, {x:e.clientX, y:e.clientY}); Z.moved = false;
  if (Z.pts.size === 2){ const [a,b] = [...Z.pts.values()]; Z.pinch = {d:Math.hypot(a.x-b.x, a.y-b.y), s:Z.s}; }
});
stage.addEventListener("pointermove", e=>{
  const prev = Z.pts.get(e.pointerId); if (!prev) return;
  Z.pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (Math.abs(e.clientX-prev.x) + Math.abs(e.clientY-prev.y) > 2) Z.moved = true;
  if (Z.pts.size === 2 && Z.pinch){
    const [a,b] = [...Z.pts.values()];
    zoomAt((a.x+b.x)/2, (a.y+b.y)/2, Z.pinch.s * Math.hypot(a.x-b.x, a.y-b.y) / Z.pinch.d);
  } else if (Z.pts.size === 1 && Z.s > 1){ Z.x += e.clientX - prev.x; Z.y += e.clientY - prev.y; applyZoom(); }
});
const endPointer = e=>{
  Z.pts.delete(e.pointerId); if (Z.pts.size < 2) Z.pinch = null;
  if (e.type === "pointerup" && !Z.moved){
    const now = e.timeStamp;
    if (now - Z.lastTap < 300){ zoomAt(e.clientX, e.clientY, Z.s > 1.01 ? 1 : 2.5); Z.lastTap = 0; }
    else Z.lastTap = now;
  }
};
stage.addEventListener("pointerup", endPointer); stage.addEventListener("pointercancel", endPointer);
stage.addEventListener("wheel", e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, Z.s * (e.deltaY < 0 ? 1.15 : 1/1.15)); }, {passive:false});
$("#zoomPrev").onclick = ()=>{ Z.i = (Z.i - 1 + gal.length) % gal.length; showZoom(); };
$("#zoomNext").onclick = ()=>{ Z.i = (Z.i + 1) % gal.length; showZoom(); };
$("#zoomClose").onclick = ()=>{ UI.closeDialog($("#zoom")); galGo(Z.i); };
$("#zoomImg").addEventListener("load", applyZoom);

/* ---------- fly to cart: a small copy of the photo travels to the cart icon ---------- */
function flyToCart(fromEl){
  const to = $("#cartBtn"); if (!fromEl || !to || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const a = fromEl.getBoundingClientRect(), b = to.getBoundingClientRect();
  if (!a.width || !a.height) return;
  const size = Math.min(a.width, a.height, 140), el = document.createElement("div");
  el.className = "fly"; el.setAttribute("aria-hidden", "true");
  el.style.cssText = `left:${a.left + (a.width-size)/2}px;top:${a.top + (a.height-size)/2}px;width:${size}px;height:${size*1.25}px;${fromEl.getAttribute("style")||""}`;
  const img = fromEl.querySelector("img.l:not(.alt)"), svg = fromEl.querySelector("svg");
  el.innerHTML = img ? `<img src="${esc(img.currentSrc || img.src)}" alt="">` : svg ? svg.outerHTML : "";
  document.body.append(el);
  const dx = b.left + b.width/2 - (a.left + a.width/2), dy = b.top + b.height/2 - (a.top + a.height/2);
  el.animate([{transform:"translate(0,0) scale(1)", opacity:1},
              {transform:`translate(${dx*.55}px,${dy*.55 - 60}px) scale(.55)`, opacity:.95, offset:.55},
              {transform:`translate(${dx}px,${dy}px) scale(.12)`, opacity:.4}],
    {duration:700, easing:"cubic-bezier(.5,0,.6,1)"}).onfinish = ()=>el.remove();
}
function showLeft(){
  const {size} = chosen(), left = size ? FB.stockOf(current,size) : null;
  $("#qLeft").textContent = left!=null&&left<=3 ? t("left")(left) : "";
  qty = Math.max(1, Math.min(qty, capOf(current,size))); $("#qQty").value = qty;
  $("#qPlus").disabled = qty >= capOf(current,size);
}

function quickPick(){

/* ---------- cart ---------- */
const keyOf = l=>`${l.id}|${l.size}|${l.color}`;
const lineOk = l=>{const p=byId(l.id); return p && p.sizes.includes(l.size) && p.colors[l.color] && !FB.soldOut(p);};
const pixelLine = l=>{ const p=byId(l.id); return {id:l.id, name:nm(p?.name), price:p?.price||0, qty:l.qty}; };
const sumOf = items=>items.reduce((s,l)=>s+(byId(l.id)?.price||0)*l.qty,0);
function addToCart(it){
  const p = byId(it.id), cap = capOf(p,it.size), line = cart.find(l=>keyOf(l)===keyOf(it));
  line ? line.qty = Math.min(cap, line.qty+it.qty) : cart.push({...it, qty:Math.min(cap,it.qty)});
  saveCart(); UI.toast(t("added"));
  FB_PIXELS.add(pixelLine(it));
  const c=$("#cartCount"), btn=$("#cartBtn"); c.classList.remove("bump"); btn.classList.remove("got"); void c.offsetWidth; c.classList.add("bump"); btn.classList.add("got");
}
function saveCart(){
  if (loaded) cart = cart.filter(lineOk);
  // merge lines that became identical after a size or color change
  const merged = [];
  cart.forEach(l=>{ const m = merged.find(x=>keyOf(x)===keyOf(l)); m ? m.qty = Math.min(capOf(byId(l.id)||{},l.size), m.qty+l.qty) : merged.push({...l}); });
  cart = merged.map(({id,size,color,qty})=>({id,size,color,qty}));
  store.set("fb34-cart",cart);
  $("#cartCount").textContent = cart.reduce((s,l)=>s+l.qty,0);
  renderDrawer();
}
// delivery estimate in the cart, from what the customer already picked in the checkout form
function shipEstimate(){
  const d = store.get("fb34-checkout",{});
  if (!d.wilaya) return {text:t("shipLater"), fee:0, known:false};
  const r = FB.rateFor(RATES, +d.wilaya, d.commune_id ?? null)[d.delivery||"home"];
  if (!r.available || r.price==null) return {text:t("shipPending"), fee:0, known:false, pending:r.available};
  return {text:fmt(r.price), fee:r.price, known:true};
}

async function submitOrder(){
  if (co.step==="sending") return;  // one request at a time, whatever the number of taps
  const d = draft(), items = coItems().map(({id,size,color,qty})=>({id,size,color,qty}));
  const payload = {idempotency_key:co.key, first_name:d.first_name.trim(), last_name:d.last_name.trim(), phone:d.phone,
    phone2:d.phone2||"", whatsapp:d.wa_same!==false ? d.phone : (d.whatsapp||""), instagram:(d.instagram||"").trim(),
    wilaya:+d.wilaya, commune_id:communeList.length ? d.commune_id : null, commune_name:communeList.length ? "" : (d.commune_name||"").trim(),
    delivery:d.delivery, address:d.delivery==="home" ? (d.address||"").trim() : "", note:(d.note||"").trim(), lang:UI.lang, items,
    hp:$("#f_hp")?.value || ""};
  co.step = "sending"; co.error = null; renderCheckout();
  try {
    const res = await FB_API.placeOrder(payload);
    if (!res || !res.tracking_code) throw new Error("network");
    co.result = res; co.step = "done";
    if (!res.repeat) FB_PIXELS.purchase(items.map(pixelLine), res);
    if (co.kind==="cart"){ cart = []; saveCart(); }
    // keep only the place choices, so the next order and the cart estimate start from the same wilaya
    store.set("fb34-checkout", {wilaya:d.wilaya, commune_id:d.commune_id, commune_label:d.commune_label, delivery:d.delivery});
    renderCheckout(); refreshCatalog();
  } catch(e){
    const m = String(e?.message||e), inv = m.match(/invalid:(\w+)/), hit = m.match(/(?:out_of_stock|unavailable):(\S+)/);
    if (inv && inv[1]!=="items" && inv[1]!=="request"){
      // the server found a field to fix: back to the form with the message next to it
      const k = fieldKey(inv[1]);
      co.step = "form"; co.key = null; co.fieldErr = {[k]: t({first:"eFirst",last:"eLast",phone:"ePhone",phone2:"ePhoneOpt",whatsapp:"ePhoneOpt",
        instagram:"eIg",wilaya:"eWilaya",commune:"eCommune",delivery:"eDelivery",address:"eAddr"}[k]||"fixFields")};
      renderCheckout(); return;
    }
    co.step = "review";
    const lim = m.match(/limit:(open|wait|ip)|\bblocked\b/);
    if (lim){ co.error = t({open:"eLimitOpen", wait:"eLimitWait", ip:"eLimitIp"}[lim[1]] || "eBlocked"); co.retry = false; co.key = null; renderCheckout(); return; }
    if (hit){ co.error = t("eStock").replace("{name}", nm(byId(hit[1])?.name)); co.retry = false; co.key = null; refreshCatalog(); }
    else { co.error = t("eNet"); co.retry = true; }  // same key on retry: no double order
    renderCheckout();
  }
}

/* ---------- film moved by scrolling ----------
   The scroll position inside the film section picks the picture to show (eased, so it glides).
   Pictures load in passes, coarse first (every 16th, then every 8th...), so the film can be scrolled
   from the first seconds; until a picture has arrived, the nearest loaded one is shown.
   The bars, cart and WhatsApp appear once the film is over (or as soon as they get keyboard focus). */
(function film(){
  const root = document.documentElement, box = $("#film"), cv = $("#filmCanvas");
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches || navigator.connection?.saveData;
  root.classList.toggle("calm", !!calm);
  // the top bars (demo note, header) move into one fixed bar; the social links and shop location go right under the film
  const bar = document.createElement("div"); bar.className = "topbar"; bar.id = "topbar";
  document.querySelectorAll("body > .demo-bar, body > .site-header").forEach(el=>bar.append(el));
  document.body.prepend(bar);
  const social = document.querySelector("body > .social-bar");
  if (social){ social.classList.add("under-film"); box.after(social); }
  let vpH = innerHeight;
  const measureVp = ()=>{ const pn = box.querySelector(".film-pin"); vpH = (pn && pn.clientHeight) || innerHeight; };
  measureVp();
  const progress = ()=>{ const r = box.getBoundingClientRect(), run = box.offsetHeight - vpH; return run > 0 ? Math.min(1, Math.max(0, -r.top / run)) : (r.top < 0 ? 1 : 0); };
  const filmEnd = ()=>box.offsetTop + box.offsetHeight - vpH;
  // once the film has been watched to the end (or skipped), a return to the home page in the same visit
  // starts at the shop; scrolling up plays the film again
  const SEEN = "fb34-film-seen", seen = ()=>{ try { sessionStorage.setItem(SEEN, "1"); } catch {} };
  const bars = ()=>{ const shown = calm ? scrollY > 24 : progress() >= .985; bar.classList.toggle("show", shown); root.classList.toggle("at-film", !shown); if (shown && !calm) seen(); };
  let back = false; try { back = sessionStorage.getItem(SEEN) === "1"; } catch {}
  if (back && !location.hash && scrollY < 10){ scrollTo({top: filmEnd() + 2, behavior: "instant"}); }
  addEventListener("scroll", bars, {passive:true}); addEventListener("resize", ()=>{ measureVp(); bars(); }); bars();
  box.addEventListener("click", e=>{ e.preventDefault(); seen(); scrollTo({top: filmEnd() + 2, behavior: calm ? "auto" : "smooth"}); });
  if (calm || !cv.getContext){ cv.remove(); return; }  // the first picture stays as a still

  const ctx = cv.getContext("2d"), bg = $("#filmBg"), bctx = bg.getContext("2d"), pin = box.querySelector(".film-pin");
  // three picture sets: "p" upright (phones held upright), "l" wide and large (computers), "s" wide and small
  const SETS = {l: __FILM_FRAMES__, s: __FILM_FRAMES__, p: __FILM_PFRAMES__};
  const big = Math.max(screen.width, screen.height, innerWidth, innerHeight) > 1100;
  let ext = "webp", started = false;
  const upright = ()=>innerHeight > innerWidth;
  const wanted = ()=>upright() ? "p" : (big && ext === "webp" ? "l" : "s");   // JPG exists for "p" and "s"
  const sets = {};
  function set(name){
    if (sets[name]) return sets[name];
    const n = SETS[name], order = [0], seen = new Set(order);
    // loading order: 0, then every 16th, every 8th, 4th, 2nd, then the rest
    for (const step of [16,8,4,2,1]) for (let i = 0; i < n; i += step) if (!seen.has(i)){ seen.add(i); order.push(i); }
    return sets[name] = {name, n, order, pics: new Array(n), loaded: new Uint8Array(n), next: 0, busy: 0, count: 0,
      blobs: new Array(n), ready: new Uint8Array(n), small: new Array(n), decoding: new Uint8Array(n)};
  }
  // Pictures are kept compressed (a few MB for the whole film) and only the ones around the current position are
  // decoded, ahead of time and off the main thread (createImageBitmap). Decoding a picture at the moment it is drawn,
  // or keeping all 200 decoded (hundreds of MB), is what made phones stutter. Every 16th picture also stays decoded
  // at a small size, so a fast flick always has something close to show.
  let BITMAP = "createImageBitmap" in window && "fetch" in window;
  const NEAR = 8, FAR = 12;
  let decodes = 0, center = 0;
  // c: where the scroll is heading (the film eases towards it), so the pictures there are ready when it arrives
  function keep(S, c){
    if (!BITMAP) return;
    center = c;
    for (let i = 0; i < S.n; i++){   // let go of full pictures that are now far away
      if (S.pics[i] && Math.abs(i - c) > FAR && Math.abs(i - Math.round(shown * (S.n - 1))) > 2){ S.pics[i].close?.(); S.pics[i] = null; S.ready[i] = S.small[i] ? 2 : 0; }
    }
    const want = [];
    for (let d = 0; d <= NEAR; d++){ if (c + d < S.n) want.push(c + d); if (d && c - d >= 0) want.push(c - d); }
    for (const i of want){
      if (decodes >= 3) break;
      if (!S.blobs[i] || S.pics[i] || S.decoding[i]) continue;
      S.decoding[i] = 1; decodes++;
      createImageBitmap(S.blobs[i]).then(bm=>{
        if (Math.abs(i - center) > FAR){ bm.close(); return; }
        S.pics[i] = bm; S.ready[i] = 1; drawn = ""; needDraw = true;
      }, ()=>{}).finally(()=>{ S.decoding[i] = 0; decodes--; });
    }
  }
  // the first picture and the coarse pass load at once; the rest waits for the page's own load, so the page
  // is not held "loading" by the film on a slow connection
  let gateOpen = document.readyState === "complete";
  if (!gateOpen) addEventListener("load", ()=>{ gateOpen = true; pump(); }, {once:true});
  let active = null, shown = 0, drawn = "", sized = "", needDraw = true, lastIdx = -1;
  function pump(){
    if (!started) return;
    const S = active = set(wanted());
    const limit = gateOpen ? S.order.length : 1 + Math.ceil(S.n / 16);
    while (S.busy < 6 && S.next < limit){
      const i = S.order[S.next++], url = `assets/film/${S.name}/${String(i+1).padStart(3,"0")}.${ext}`; S.busy++;
      const viaImage = ()=>{   // the plain way, used when pictures cannot be fetched and decoded ahead
        const im = new Image(); im.decoding = "async";
        im.onload = ()=>{ S.pics[i] = im; S.ready[i] = 1; got(); };
        im.onerror = ()=>{ S.busy--; pump(); };
        im.src = url;
      };
      const got = ()=>{ S.busy--; S.loaded[i] = 1; S.count++; if (S === active){ cv.dataset.loaded = String(S.count); if (i === 0) cv.dataset.ready = "1"; } drawn = ""; needDraw = true; pump(); };
      if (BITMAP){
        fetch(url).then(r=>r.ok ? r.blob() : Promise.reject(r.status)).then(async bl=>{
          S.blobs[i] = bl;
          // the first picture and every 16th: a small copy that always stays decoded
          if (i % 16 === 0 || i === S.n - 1){
            const small = await createImageBitmap(bl, {resizeWidth: Math.max(160, Math.round(cv.clientWidth * .6)), resizeQuality: "low"}).catch(()=>null);
            if (small){ S.small[i] = small; if (!S.ready[i]) S.ready[i] = 2; }
          }
          got(); keep(S, Math.round(progress() * (S.n - 1)));
        }).catch(()=>{ BITMAP = false; viaImage(); });
      } else viaImage();
    }
  }
  // WebP check (a 1x1 picture); old browsers get the JPG pictures
  const probe = new Image();
  probe.onload = ()=>{ if (!probe.width) ext = "jpg"; started = true; pump(); };
  probe.onerror = ()=>{ ext = "jpg"; started = true; pump(); };
  probe.src = "data:image/webp;base64,UklGRiIAAABXRUJQVlA4IBYAAAAwAQCdASoBAAEADsD+JaQAA3AAAAAA";
  // the phone is turned: switch to the set that fits, keep showing the other one until it arrives
  addEventListener("resize", ()=>{ needDraw = true; lastIdx = -1; if (started && active && wanted() !== active.name) pump(); });

  function fit(){
    // 1.5 pixels per screen point at most: the pictures themselves are 720 px wide on phones, so more adds no detail,
    // only work (a 2x or 3x canvas was a main cause of stutter on phones)
    const w = cv.clientWidth, h = cv.clientHeight, k = Math.min(devicePixelRatio || 1, 1.5), key = `${w}x${h}@${k}`;
    if (key !== sized){ sized = key; cv.width = Math.round(w * k); cv.height = Math.round(h * k); drawn = ""; }
  }
  // closest picture ready to draw: a full one within reach first, else the closest small one
  const nearest = (S, i)=>{
    for (let d = 0; d <= FAR; d++){ if (i-d >= 0 && S.ready[i-d] === 1) return i-d; if (i+d < S.n && S.ready[i+d] === 1) return i+d; }
    for (let d = 0; d < S.n; d++){ if (i-d >= 0 && S.ready[i-d]) return i-d; if (i+d < S.n && S.ready[i+d]) return i+d; }
    return -1;
  };
  // picture for the current progress: from the wanted set, else from any set already loaded
  function pick(p){
    for (const S of [active, ...Object.values(sets).filter(x=>x !== active)]){
      if (!S || !S.count) continue;
      const i = nearest(S, Math.round(p * (S.n - 1)));
      if (i >= 0) return [S, i];
    }
    return null;
  }
  function draw(S, i){
    const src = S.pics[i] || S.small[i], W = cv.width, H = cv.height;
    // a full picture or its small copy: only the shape matters for the sizes below
    const im = {naturalWidth: src.naturalWidth || src.width, naturalHeight: src.naturalHeight || src.height};
    // the picture's shape matches the screen: fill it (cover). Otherwise (wide picture on an upright screen, while
    // the upright set is still on its way): the whole picture over a blurred copy that fills the screen.
    const match = (im.naturalHeight > im.naturalWidth) === (H > W);
    const s = match ? Math.max(W / im.naturalWidth, H / im.naturalHeight) : Math.min(W / im.naturalWidth, H / im.naturalHeight);
    const dw = im.naturalWidth * s, dh = im.naturalHeight * s;
    pin.classList.toggle("fill", match);
    if (!match){
      // the blurred copy is drawn small (the blur hides the detail) and stretched by CSS: cheap on any phone
      const bw = 72, bh = Math.round(bw * bg.clientHeight / Math.max(1, bg.clientWidth)), c = Math.max(bw / im.naturalWidth, bh / im.naturalHeight);
      if (bg.width !== bw || bg.height !== bh){ bg.width = bw; bg.height = bh; }
      bctx.drawImage(src, (bw - im.naturalWidth * c) / 2, (bh - im.naturalHeight * c) / 2, im.naturalWidth * c, im.naturalHeight * c);
      ctx.clearRect(0, 0, W, H);
    }   // when it fills the screen the picture covers every pixel: nothing to clear
    ctx.drawImage(src, (W - dw) / 2, (H - dh) / 2, dw, dh);
    drawn = S.name + i + S.ready[i]; cv.dataset.frame = String(i); cv.dataset.set = S.name; cv.dataset.last = String(S.n - 1);
  }
  (function tick(){
    const r = box.getBoundingClientRect();
    if (r.bottom > 0 && r.top < innerHeight){   // only while the film is on screen
      // the frame is locked straight to the scroll position — no easing, so it never lags behind the finger
      const target = shown = progress();
      const idx = active ? Math.round(target * (active.n - 1)) : 0;
      // nothing to do while the frame is unchanged (e.g. a slow scroll between two frames): keeps the loop idle and the scroll smooth
      if (idx !== lastIdx || needDraw){
        lastIdx = idx; needDraw = false;
        fit();
        if (active) keep(active, idx);
        const hit = pick(shown);
        if (hit && hit[0].name + hit[1] + hit[0].ready[hit[1]] !== drawn) draw(hit[0], hit[1]);
      }
    }
    requestAnimationFrame(tick);
  })();
})();
// the brand lines appear as they come into view
(function(){
  const lines = $("#brandLines");
  if (!("IntersectionObserver" in window)) return lines.classList.add("reveal");
  const io = new IntersectionObserver(([e])=>{ if (e.isIntersecting){ lines.classList.add("reveal"); io.disconnect(); } }, {threshold:.25});
  io.observe(lines);
})();

$("#cartCount").textContent = cart.reduce((s,l)=>s+l.qty,0);
applyTexts();
refreshCatalog().then(()=>{
  // links from other pages: #cart opens the cart, #p-<id> opens a product
  const h = decodeURIComponent(location.hash.slice(1));
  if (h==="cart") $("#cartBtn").click();
  else if (h.startsWith("p-") && byId(h.slice(2))) openProduct(h.slice(2));
});
if ("requestIdleCallback" in window) requestIdleCallback(()=>UI.ripple()); else setTimeout(()=>UI.ripple(), 600);
